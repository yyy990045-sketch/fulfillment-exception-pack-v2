<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solution Pack Workspace</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/workspace/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">SOLUTION PACK WORKSPACE</p>
      <h1 id="context-title">业务上下文</h1>
      <p id="context-meta"></p>
    </header>
    <div id="state-banner" class="banner"></div>
    <section class="panel">
      <h2 id="thread-title">Business Thread</h2>
      <div id="thread" class="thread"></div>
    </section>
    <section class="grid">
      <article class="panel"><h3>Rules</h3><div id="rules"></div></article>
      <article class="panel"><h3>Exceptions</h3><div id="exceptions"></div></article>
      <article class="panel"><h3>Outcomes</h3><div id="outcomes"></div></article>
    </section>
  </main>
  <script type="module" src="/workspace/app.js"></script>
</body>
</html>
