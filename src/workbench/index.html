<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>履约异常处理台</title>
  <style>
    :root {
      --ink: #1d1d1f;
      --ink-soft: #3a3a3c;
      --paper: #f5f5f7;
      --card: #ffffff;
      --line: #e8e8ed;
      --muted: #6e6e73;
      --accent: #175cd3;
      --accent-deep: #0e3e9e;
      --accent-soft: #eaf1fc;
      --good: #1f9d55;
      --good-soft: #e8f5ec;
      --signal: #d92d20;
      --signal-soft: #fdeceb;
      --amber: #d97c06;
      --amber-soft: #fdf3e0;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    .app-shell { min-height: 100vh; height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .topbar { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 14px clamp(18px, 4vw, 48px); border-bottom: 1px solid var(--line); background: var(--card); color: var(--ink); }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 650; }
    .brand-copy { min-width: 0; }
    .brand-copy strong { display: block; font-size: 17px; letter-spacing: .02em; }
    .brand-copy span { display: block; margin-top: 1px; color: var(--muted); font-size: 12px; }
    .topbar-links { display: inline-flex; align-items: center; gap: 20px; margin-left: auto; margin-right: clamp(12px, 3vw, 34px); color: var(--muted); font-size: 12px; }
    .topbar-link { position: relative; border: 0; padding: 8px 0; background: transparent; color: inherit; cursor: pointer; font: inherit; white-space: nowrap; }
    .topbar-link.active { color: var(--accent); font-weight: 650; }
    .topbar-link.active::after { content: ""; position: absolute; right: 0; bottom: 1px; left: 0; height: 2px; border-radius: 2px; background: var(--accent); }
    .nav-group { position: relative; }
    .nav-toggle { display: inline-flex; align-items: center; gap: 5px; padding: 7px 13px; border: 1px solid rgba(0,0,0,.16); border-radius: 999px; }
    .nav-toggle:hover { border-color: rgba(0,0,0,.34); }
    .nav-toggle .nav-caret { font-size: 9px; transform: translateY(-1px); transition: transform .18s ease; }
    .nav-group.open .nav-caret { transform: rotate(180deg); }
    .nav-group.has-active .nav-toggle { color: var(--accent); border-color: var(--accent); font-weight: 650; }
    .nav-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; display: flex; flex-direction: column; min-width: 172px; padding: 6px; background: #fff; border: 1px solid rgba(0,0,0,.1); border-radius: 12px; box-shadow: 0 14px 34px rgba(40,12,4,.16); }
    .nav-menu .topbar-link { padding: 8px 12px; border-radius: 8px; text-align: left; }
    .nav-menu .topbar-link:hover { background: rgba(0,0,0,.055); }
    .nav-menu .topbar-link.active { color: var(--accent); font-weight: 650; }
    .nav-menu .topbar-link.active::after { display: none; }
    .relation-fold { margin: 14px 0 2px; }
    .relation-fold > summary { font-weight: 650; cursor: pointer; }
    .relation-fold[open] > summary { margin-bottom: 10px; }
    .topbar-note { min-width: 0; overflow: hidden; color: var(--muted); font-size: 12px; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
    .workspace { display: grid; grid-template-columns: 320px minmax(0, 1fr); max-width: none; width: 100%; min-height: 0; height: auto; margin: 0 auto; align-items: stretch; overflow: hidden; }
    .queue { min-height: 0; overflow-y: auto; border-right: 1px solid var(--line); background: transparent; padding: 24px 16px; scrollbar-gutter: stable; }
    .queue-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 8px 14px; }
    .queue-head h1 { margin: 0; font-size: 17px; }
    .count { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 24px; padding: 0 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 650; }
    .search { width: 100%; margin-bottom: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; outline: none; background: #fff; color: var(--ink); }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(23,92,211,.16); }
    .queue-picker { display: none; width: 100%; margin-bottom: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
    .module-picker { display: none; width: 100%; margin-bottom: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
    .queue-list { display: grid; gap: 8px; }
    .case-item { width: 100%; border: 1px solid transparent; border-radius: 12px; padding: 12px; background: transparent; color: var(--ink); text-align: left; transition: .15s ease; }
    .case-item:hover { border-color: var(--line); background: #fff; }
    .case-item.active { border-color: transparent; background: var(--accent-soft); }
    .case-item-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .case-id { color: var(--accent); font: 700 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em; }
    .case-title { display: block; margin: 7px 0 6px; overflow: hidden; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .case-meta { color: var(--muted); font-size: 12px; }
    .status-dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--muted); vertical-align: 1px; }
    .status-dot.status-closed, .status-dot.status-verified { background: var(--good); }
    .status-dot.status-approved, .status-dot.status-executed { background: var(--amber); }
    .status-dot.status-proposed, .status-dot.status-confirmed, .status-dot.status-triaged { background: #8e8e93; }
    .content { min-width: 0; min-height: 0; overflow-y: auto; padding: 28px clamp(18px, 4vw, 48px) 56px; background: var(--paper); }
    .content-inner { width: 100%; margin: 0 auto; }
    .level-nav { display: flex; align-items: stretch; gap: 6px; margin: 0 0 20px; padding: 4px; border: 1px solid var(--line); border-radius: 11px; background: #ededf1; }
    .level-tab { flex: 1; border: 0; border-radius: 8px; padding: 9px 12px; background: transparent; color: var(--muted); text-align: left; transition: .15s ease; }
    .level-tab:hover { background: rgba(255,255,255,.7); color: var(--ink); }
    .level-tab.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.07); }
    .level-tab.done { color: var(--accent); }
    .level-tab.locked { color: #b0b0b6; background: #e2e2e7; }
    .level-tab strong { display: block; font-size: 13px; }
    .level-tab small { display: block; margin-top: 2px; color: inherit; opacity: .72; font-size: 11px; }
    .level-kicker { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 12px; color: var(--muted); font-size: 12px; }
    .level-kicker strong { color: var(--ink-soft); font-size: 13px; }
    .level-kicker-actions { display: inline-flex; align-items: center; gap: 8px; }
    .level-back { border: 0; padding: 4px 0; background: transparent; color: var(--accent); font-size: 12px; font-weight: 650; }
    .level-back:hover { text-decoration: underline; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 0 0 14px; }
    .section-heading h3 { margin: 0; font-size: 16px; }
    .section-heading span { color: var(--muted); font-size: 12px; }
    .overview-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(260px, .75fr); gap: 14px; margin-bottom: 18px; }
    .summary-card { min-width: 0; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); }
    .summary-card.emphasis { border-color: #c3d6f5; background: #eef4fd; }
    .summary-card h3 { margin: 0 0 9px; font-size: 15px; }
    .summary-card p { margin: 0; color: var(--ink-soft); }
    .summary-card .summary-lead { font-size: 20px; line-height: 1.3; letter-spacing: -.02em; }
    .summary-card .summary-note { margin-top: 10px; color: var(--muted); font-size: 12px; }
    .summary-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .summary-list li { display: flex; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid #eeeef1; }
    .summary-list li:last-child { padding-bottom: 0; border-bottom: 0; }
    .summary-list span { flex: 0 0 76px; color: var(--muted); }
    .summary-list strong { color: var(--ink-soft); }
    .next-step { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 14px; padding: 13px 14px; border: 1px solid #f0dda6; border-radius: 12px; background: var(--amber-soft); }
    .next-step strong { display: block; color: var(--amber); }
    .next-step span { display: block; margin-top: 2px; color: #8a6d1f; font-size: 12px; }
    .next-step .act { flex: 0 0 auto; }
    .level-panel { display: none; }
    .level-panel.active { display: block; animation: level-in .24s ease both; }
    @keyframes level-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .panel-intro { margin: -4px 0 14px; color: var(--muted); font-size: 13px; }
    .section-stack { display: grid; gap: 18px; }
    .relation-panel { overflow: hidden; }
    .relation-headline { display: flex; align-items: center; gap: 8px; }
    .relation-live { display: inline-flex; align-items: center; gap: 6px; color: var(--good) !important; }
    .relation-live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
    .relation-map { position: relative; min-height: 350px; margin: 0 18px 14px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: radial-gradient(circle at 50% 44%, rgba(224, 228, 236, .6), transparent 37%), #fbfbfc; }
    .relation-map::before { content: ""; position: absolute; inset: 0; opacity: .55; background-image: linear-gradient(rgba(0,0,0,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.045) 1px, transparent 1px); background-size: 28px 28px; mask-image: linear-gradient(135deg, rgba(0,0,0,.9), transparent 75%); }
    .relation-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
    .relation-link { fill: none; stroke: #d5d5da; stroke-width: 2; stroke-dasharray: 6 8; }
    .relation-link.hot { stroke: #d4472f; }
    .relation-link.gold { stroke: #e49a18; }
    .relation-link.cool { stroke: #36a981; }
    .relation-node { position: absolute; z-index: 1; width: 190px; min-height: 78px; transform: translate(-50%, -50%); padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); text-align: left; box-shadow: 0 1px 3px rgba(0,0,0,.06); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
    .relation-node:hover, .relation-node.selected { transform: translate(-50%, -50%) scale(1.02); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
    .relation-node:focus-visible { outline: 3px solid rgba(23,92,211,.28); outline-offset: 3px; }
    .relation-node strong { display: block; margin-top: 4px; font-size: 16px; }
    .relation-node small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .relation-node .node-kicker { color: var(--muted); font-size: 11px; }
    .relation-node.core { left: 50%; top: 43%; width: 235px; border-color: var(--accent-deep); background: var(--accent); color: #fff; text-align: center; box-shadow: 0 2px 8px rgba(23,92,211,.18); }
    .relation-node.core .node-kicker, .relation-node.core small { color: #c9dcff; }
    .relation-node.core strong { font-size: 18px; }
    .relation-node.source-quote { left: 16%; top: 22%; border-color: #d78b19; }
    .relation-node.source-order { left: 84%; top: 22%; border-color: var(--accent); }
    .relation-node.source-payment { left: 24%; top: 79%; border-color: var(--good); }
    .relation-node.source-complaint { left: 76%; top: 79%; border-color: #b5b5bb; }
    .relation-node.source-quote strong { color: #b56b0d; }
    .relation-node.source-order strong { color: var(--accent); }
    .relation-node.source-payment strong { color: var(--good); }
    .relation-caption { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 18px 16px; color: var(--muted); font-size: 12px; }
    .relation-caption strong { color: var(--ink-soft); }
    .module-view { display: grid; gap: 18px; animation: level-in .24s ease both; }
    .module-heading { padding: 4px 0 2px; }
    .module-heading h3 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.02em; }
    .module-heading p { margin: 6px 0 0; color: var(--muted); }
    .module-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .module-kpi { position: relative; overflow: hidden; padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: var(--shadow); }
    .module-kpi.good strong { color: var(--good); }
    .module-kpi.warn strong { color: var(--amber); }
    .module-kpi.alert strong { color: var(--signal); }
    .module-kpi span { display: block; color: var(--muted); font-size: 12px; }
    .module-kpi strong { display: block; margin-top: 4px; font-size: 26px; font-weight: 650; letter-spacing: -.02em; }
    .module-kpi small { display: block; margin-top: 4px; color: var(--muted); }
    .entity-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 0 18px 18px; }
    .entity-card { padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: #fafafc; }
    .entity-card strong { display: block; font-size: 15px; }
    .entity-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .decision-grid, .sandbox-grid, .action-breakdown { display: grid; gap: 12px; }
    .decision-grid { grid-template-columns: 1.2fr .8fr; }
    .decision-card, .sandbox-card, .breakdown-card { padding: 17px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: var(--shadow); }
    .decision-card h4, .sandbox-card h4, .breakdown-card h4 { margin: 0 0 7px; font-size: 15px; }
    .decision-card p, .sandbox-card p { margin: 0; color: var(--ink-soft); }
    .decision-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .decision-actions .act { flex: 1 1 120px; }
    .sandbox-grid { grid-template-columns: minmax(0, 1fr) minmax(260px, .8fr); }
    .sandbox-select { width: 100%; margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--card); color: var(--ink); }
    .simulation-output { min-height: 116px; margin-top: 12px; padding: 13px; border: 1px dashed #d5d5da; border-radius: 11px; background: #f7f7f9; color: var(--ink-soft); }
    .breakdown-card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; }
    .breakdown-index { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 650; }
    .breakdown-card strong { display: block; }
    .breakdown-card small { display: block; margin-top: 3px; color: var(--muted); }
    .breakdown-state { color: var(--good); font-size: 12px; font-weight: 650; }
    .capability-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .capability-card { position: relative; min-height: 130px; padding: 17px 18px 15px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: var(--shadow); }
    .capability-card h4 { margin: 0 0 7px; font-size: 15px; }
    .capability-card p { margin: 0; color: var(--muted); font-size: 13px; }
    .capability-card .act { position: absolute; right: 16px; bottom: 14px; }
    .source-name { color: var(--ink-soft); font-weight: 650; }
    .source-detail { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .detail-toggle { display: inline-flex; align-items: center; gap: 5px; border: 0; padding: 0; background: transparent; color: var(--accent); font-size: 12px; font-weight: 650; }
    .detail-toggle:hover { text-decoration: underline; }
    .audit-detail { display: none; margin-top: 12px; padding: 12px; border-radius: 10px; background: #f4f4f6; color: var(--muted); font-size: 12px; }
    .audit-detail.open { display: block; }
    .level-empty { padding: 30px 18px; border: 1px dashed #d5d5da; border-radius: 12px; background: #fafafc; color: var(--muted); text-align: center; }
    .queue-intro { margin-bottom: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-size: 12px; color: var(--muted); }
    .queue-intro summary { cursor: pointer; font-weight: 650; color: var(--accent); }
    .queue-intro p { margin: 8px 0 0; line-height: 1.7; }
    .live-region { min-height: 22px; margin-bottom: 8px; color: var(--signal); font-size: 13px; }
    .hero { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 26px; padding: 2px 2px 18px; border-bottom: 1px solid var(--line); }
    .hero > * { min-width: 0; }
    .eyebrow { margin: 0 0 7px; color: var(--muted); font: 650 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
    h2 { margin: 0; max-width: 760px; color: var(--ink); font-size: clamp(20px, 2.2vw, 26px); font-weight: 600; line-height: 1.2; letter-spacing: -.02em; }
    .hero-meta { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
    .hero-meta code { padding: 2px 5px; border-radius: 5px; background: #f0f0f3; color: var(--ink-soft); font-size: 12px; }
    .status-pill { flex: 0 0 auto; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: #f0f0f3; color: var(--ink-soft); font-size: 12px; font-weight: 650; }
    .status-pill.status-closed, .status-pill.status-verified { border-color: #a9d9c9; background: var(--good-soft); color: var(--good); }
    .status-pill.status-approved, .status-pill.status-executed { border-color: #ead39c; background: var(--amber-soft); color: var(--amber); }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; }
    .metric { position: relative; min-width: 0; overflow: hidden; padding: 16px 18px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: var(--shadow); }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { display: block; margin-top: 4px; font-size: 26px; font-weight: 650; letter-spacing: -.02em; }
    .metric-value.compact { font-size: 16px; line-height: 1.35; letter-spacing: -.01em; }
    .metric-value.alert { color: var(--signal); }
    .metric-value.good { color: var(--good); }
    .stepper-scroll { position: relative; min-width: 0; }
    .stepper-scroll::before { content: ""; position: absolute; z-index: 2; top: 0; right: 0; bottom: 7px; width: 34px; pointer-events: none; background: linear-gradient(90deg, rgba(255,255,255,0), var(--card)); opacity: 0; transition: opacity .15s ease; }
    .stepper { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 24px; }
    .step { position: relative; min-width: 0; padding: 10px 10px 10px 34px; border: 1px solid var(--line); border-radius: 11px; background: #f0f0f3; color: var(--muted); }
    .step::before { content: attr(data-step); position: absolute; left: 10px; top: 10px; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: #e0e0e5; color: #6e6e73; font-size: 10px; font-weight: 650; }
    .step strong { display: block; overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .step small { display: block; overflow: hidden; margin-top: 2px; text-overflow: ellipsis; white-space: nowrap; }
    .step.done { border-color: #b8ded2; background: var(--good-soft); color: var(--good); }
    .step.done::before { background: var(--good); color: #fff; }
    .step.current { border-color: #d9b978; background: var(--amber-soft); color: var(--amber); }
    .step.current::before { background: var(--amber); color: #fff; }
    .panel { min-width: 0; margin-bottom: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 17px 18px 13px; border-bottom: 1px solid var(--line); }
    .panel-head h3 { margin: 0; font-size: 15px; }
    .panel-head span { color: var(--muted); font-size: 12px; }
    .panel-body { padding: 16px 18px; }
    .report-summary { margin: 0 0 14px; color: var(--ink-soft); font-weight: 650; }
    .report-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
    .report-grid > div { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #f7f7f9; }
    .report-grid h4, .report-panel h4 { margin: 0 0 6px; color: var(--ink-soft); font-size: 12px; }
    .report-grid p { margin: 0; color: var(--ink-soft); font-size: 13px; }
    .report-panel table { margin-bottom: 14px; }
    .report-citations { display: grid; gap: 8px; margin: 0; padding-left: 20px; color: var(--ink-soft); }
    .report-citations li { padding-left: 3px; font-size: 12px; }
    .report-citations .quote { display: inline-block; margin-top: 2px; color: var(--muted); }
    .evidence-details { border-top: 1px solid var(--line); }
    .evidence-details summary { padding: 14px 0; color: var(--accent); cursor: pointer; font-weight: 650; }

    .nav-group { position: relative; }

    .nav-menu { position: absolute; right: 0; top: calc(100% + 6px); background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 26px rgba(0,0,0,.10); padding: 6px; display: flex; flex-direction: column; min-width: 168px; z-index: 30; }

    .report-details { margin-top: 2px; }

    .conflict-evidence-body strong { color: var(--ink-soft); }

    .investigate-next strong { display: block; color: var(--accent); }
    .investigate-next span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .next-action-empty { margin: 0; padding: 10px 0; color: var(--accent); font-weight: 650; }

    .act .hint { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; font-weight: 400; }
    .act.primary .hint { color: #c9dcff; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #eeeef1; padding: 10px 8px; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
    td { color: var(--ink-soft); font-size: 13px; }
    td code, .mono { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }

    .conflict-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: 12px; }
    .conflict-side { min-width: 0; padding: 14px; border: 1px solid #f0d1ca; border-radius: 12px; background: var(--signal-soft); }
    .conflict-side strong { display: block; margin-bottom: 6px; color: var(--signal); font-size: 15px; overflow-wrap: anywhere; }

    .conflict-card { padding: 12px 0; border-bottom: 1px solid #eeeef1; }

    .severity { display: inline-block; margin-bottom: 9px; padding: 3px 7px; border-radius: 999px; background: var(--signal-soft); color: var(--signal); font-size: 11px; font-weight: 650; }
    .empty { margin: 0; color: var(--muted); }
    .gap-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .gap-list li { padding: 6px 9px; border-radius: 8px; background: var(--amber-soft); color: var(--amber); font-size: 12px; }
    .action-row { display: grid; grid-template-columns: 1.3fr .8fr 1fr; gap: 10px; padding: 11px 0; border-bottom: 1px solid #eeeef1; }

    .action-state { color: var(--ink-soft); font-size: 12px; }
    .receipt { color: var(--accent); font: 11px/1.4 ui-monospace, monospace; overflow-wrap: anywhere; }
    .timeline { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
    .timeline li { position: relative; padding: 0 0 15px 24px; color: var(--ink-soft); }
    .timeline li::before { content: ""; position: absolute; left: 4px; top: 5px; width: 9px; height: 9px; border: 2px solid var(--accent); border-radius: 50%; background: #fff; }
    .timeline li::after { content: ""; position: absolute; left: 8px; top: 16px; bottom: 0; width: 1px; background: #d5d5da; }
    .timeline li:last-child { padding-bottom: 0; }
    .timeline li:last-child::after { display: none; }
    .timeline time { display: block; color: var(--muted); font-size: 11px; }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 10; max-width: min(360px, calc(100vw - 40px)); padding: 11px 14px; border: 1px solid #f0c4c0; border-radius: 12px; background: var(--card); color: var(--signal); box-shadow: var(--shadow); }

    @media (max-width: 1024px) {
      .workspace { display: block; width: 100%; max-width: 100%; height: auto; overflow: visible; }
      .queue { width: 100%; max-width: 100%; height: auto; max-height: none; overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px clamp(18px, 4vw, 48px); }
      .queue-picker { display: block; }
      .module-picker { display: block; }
      .queue-list { display: none; }
      .content { width: 100%; max-width: 100%; min-height: 0; overflow: visible; padding: 28px clamp(18px, 4vw, 48px) 56px; }
      .content-inner { width: 100%; max-width: 100%; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .module-kpis, .entity-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .capability-grid { grid-template-columns: 1fr; }
      .decision-grid, .sandbox-grid { grid-template-columns: 1fr; }
      .topbar { gap: 12px; padding: 12px 18px; }
      .topbar-links { display: none; }
      .brand-copy strong, .brand-copy span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .brand-copy span { max-width: min(48vw, 430px); }
      .topbar-note { margin-left: auto; }
      .stepper-scroll { overflow-x: auto; padding-bottom: 3px; scrollbar-color: var(--accent) transparent; }
      .stepper { grid-template-columns: repeat(5, minmax(110px, 1fr)); min-width: 560px; margin-bottom: 0; }

    @media (min-width: 681px) and (max-width: 1024px) {
      .topbar > * { min-width: 0; }

      .topbar { align-items: flex-start; padding: 15px 16px; }

      .next-step .act { width: 100%; }
      .hero { display: block; padding: 22px 20px 20px; border-radius: 16px; }
      .status-pill { display: inline-flex; margin-top: 12px; }
      .metrics { gap: 8px; }
      .metric { padding: 11px 12px; }
      .metric-value { font-size: 21px; }
      .panel-head, .panel-body { padding-left: 14px; padding-right: 14px; }
      .conflict-grid { grid-template-columns: 1fr; gap: 7px; }
      .vs { padding: 0 4px; }
      .report-grid { grid-template-columns: 1fr; }
      .action-row { grid-template-columns: 1fr 1fr; }
      .action-row .action-summary { grid-column: 1 / -1; }
      .quote { min-width: 180px; }
      .relation-map { min-height: 480px; margin: 0 14px 12px; }
      .relation-node { width: 155px; min-height: 70px; padding: 10px 11px; }
      .relation-node strong { font-size: 14px; }
      .relation-node.core { width: 190px; }
      .relation-node.source-quote { left: 28%; top: 17%; }
      .relation-node.source-order { left: 72%; top: 17%; }
      .relation-node.source-payment { left: 28%; top: 78%; }
      .relation-node.source-complaint { left: 72%; top: 78%; }
      .relation-caption { margin: 0 14px 14px; align-items: flex-start; flex-direction: column; }
      .stepper-scroll::before { opacity: 1; }
      .stepper-scroll::after { content: "左右滑动 · 共 5 步"; position: absolute; z-index: 3; top: 6px; right: 6px; display: block; padding: 2px 7px; border-radius: 999px; background: rgba(240,240,243,.96); color: var(--ink-soft); font-size: 11px; font-weight: 650; pointer-events: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .level-panel.active, .relation-link, .relation-live i, .relation-node.core { animation: none; }

</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">FX</div>
        <div class="brand-copy"><strong>销售履约异常处理台</strong><span>报价单、订单、回款、客诉各说各话？系统自动拉齐比对找出矛盾，带证据走完处理闭环</span></div>
      </div>
      <nav class="topbar-links" aria-label="工作台导航">
        <button class="topbar-link active" data-module="workbench">案件工作台</button>
        <div class="nav-group" id="nav-group">
          <button class="topbar-link nav-toggle" id="nav-capability-toggle" aria-expanded="false" aria-controls="nav-capability-menu">能力全景 <span class="nav-caret">▾</span></button>
          <div class="nav-menu" id="nav-capability-menu" hidden>
            <button class="topbar-link" data-module="monitor">☁ 孪生监控</button>
            <button class="topbar-link" data-module="ontology">🗂 本体地图</button>
            <button class="topbar-link" data-module="adjudication">⚖ 报告裁决</button>
            <button class="topbar-link" data-module="sandbox">🧪 推演沙盘</button>
            <button class="topbar-link" data-module="actions">🎨 行动拆解</button>
            <button class="topbar-link" data-module="more">⋯ 更多能力</button>
          </div>
        </div>
      </nav>
      <div class="topbar-note">演示数据 · 所有处理过程可回看</div>
    </header>
    <main class="workspace">
      <aside class="queue" aria-label="案件队列">
        <details class="queue-intro" open>
          <summary>这是什么？第一次看点这里</summary>
          <p>制造业里，报价单、订单、回款、客诉经常各说各话（比如客户按 100 件索赔，订单只写了 80 件）。这个工作台把四类单据自动拉齐比对，指出矛盾，每条结论都附单据原文；然后带着你走完「核对 → 方案 → 审批 → 执行 → 存证 → 结案」全流程，每一步留痕可回看。从左侧选一件案件开始（如 FX-014），或直接用 Coze 智能体对话调查。</p>
        </details>
        <div class="queue-head"><h1>销售履约待处理</h1><span id="case-count" class="count">0 件</span></div>
        <select id="case-picker" class="queue-picker" aria-label="选择销售履约案件"><option>正在加载案件…</option></select>
        <select id="module-picker" class="module-picker" aria-label="选择工作能力"><option value="workbench">案件工作台</option><option value="monitor">孪生监控</option><option value="ontology">本体地图</option><option value="adjudication">报告裁决</option><option value="sandbox">推演沙盘</option><option value="actions">行动拆解</option><option value="more">更多能力</option></select>
        <input id="search" class="search" type="search" placeholder="搜索编号或主题…" aria-label="搜索案件" />
        <div id="list" class="queue-list"></div>
      </aside>
      <section class="content" id="view" aria-live="polite">正在加载工作台…</section>
    </main>
  </div>
  <div id="toast" class="toast hidden" role="alert"></div>
  <script>
    const listEl = document.getElementById("list");
    const view = document.getElementById("view");
    const searchEl = document.getElementById("search");
    const pickerEl = document.getElementById("case-picker");
    const modulePickerEl = document.getElementById("module-picker");
    const countEl = document.getElementById("case-count");
    const toastEl = document.getElementById("toast");
    let currentId = "FX-001";
    let currentLevel = "overview";
    let currentModule = "workbench";
    let capabilitySnapshot = {};
    let caseGate = { status: "new", conflicts: 0, gaps: 0, reviewedConflictIds: [], reviewedIssueIds: [], conflictReviews: [] };
    let caseRows = [];
    let toastTimer;
    let reviewingConflict = false;
    let renderGeneration = 0;

    const statusLabel = { new: "新收", triaged: "已分流", confirmed: "已确认", proposed: "待审批", approved: "已批准", executed: "已执行", verified: "已核验", closed: "已结案", rejected: "已驳回" };
    const queueStatusLabel = { new: "待核对", triaged: "待核对", confirmed: "已确认", proposed: "待确认", approved: "待处理", executed: "待结案", verified: "待结案", closed: "已完成", rejected: "已驳回" };
    const severityLabel = { low: "低", medium: "中", high: "高", critical: "严重" };
    const packLabel = { fulfillment: "销售履约", "it-alert": "系统告警" };
    const fieldLabel = { model: "产品型号", qty: "数量", amount: "金额", date: "日期", status: "状态", party: "责任人/部门", orderId: "订单号" };
    const supportLabel = { supported: "已定位材料", partial: "材料不完整", unsupported: "没有可靠材料" };
    const actionLabel = { supplement_evidence: "补齐订单或变更单", urge_follow_up: "催办负责人跟进", reject_overclaim: "驳回无依据的超额索赔", route_quotation_to_review: "送入报价复核", approve_or_change_quotation_terms: "批准或变更报价条款", review_quotation: "复核报价与订单差异（历史）", create_task: "创建跟进任务" };
    const actionStatusLabel = { draft: "待提交", pending_approval: "等负责人确认", authorized: "已确认，待处理", executing: "处理中", succeeded: "已处理", failed: "处理失败", verified: "已核对" };
    const flow = [
      ["接收", "接收材料", ["new"]],
      ["查证", "整理依据", ["triaged"]],
      ["复核", "确认差异", ["confirmed", "proposed"]],
      ["处置", "处理方案", ["approved", "executed"]],
      ["结案", "核对结果", ["verified", "closed"]],
    ];
    const levelMeta = {
      overview: ["异常概览", "先看结论和风险"],
      investigate: ["核对证据", "逐项确认差异"],
      resolve: ["处理与结案", "确认方案并留下结果"],
    };
    const moduleMeta = {
      workbench: "案件工作台",
      monitor: "孪生监控",
      ontology: "本体地图",
      adjudication: "报告裁决",
      sandbox: "推演沙盘",
      actions: "行动拆解",
      more: "更多能力",
    };
    const reportStatusLabel = { new: "待复核", proposed: "方案待确认", approved: "方案已确认", executed: "处理中", verified: "待结案", closed: "已结案" };
    const actorLabel = { system: "系统" };
    const reasonLabel = { intake: "接收材料", "草案提交审批": "提交处理方案", "批准": "确认处理方案", "登记外部能力回执": "记录处理结果", "外部能力回执已登记": "收到处理回执", "核验": "核对处理结果", "结案": "完成结案", "无冲突结案": "材料一致，直接结案" };

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }
    function displayTitle(value) {
      return String(value ?? "")
        .replace("空文件无 locator", "材料为空，无法定位原文")
        .replace("无 scope 必须 fail-closed", "没有处理范围，已安全停止")
        .replace("IT告警第二包：同一Case/Action", "系统告警第二组：同一案件动作")
        .replace("inode 耗尽", "文件目录空间不足")
        .replace(/\bvs\b/gi, "与")
        .replace(/v2/g, "第二版")
        .replace(/v1/g, "第一版");
    }
    function loc(item) {
      const l = item?.locator || {};
      const file = String(l.fileName || item?.sourceId || "材料").toLowerCase();
      const label = file.includes("quote") || file.includes("报价") ? "报价单" : file.includes("order") || file.includes("订单") ? "订单" : file.includes("payment") || file.includes("回款") ? "回款记录" : file.includes("complaint") || file.includes("客诉") ? "客诉记录" : file.includes("it-") || file.includes("alert") ? "系统告警" : "相关材料";
      const position = l.row ? `第${l.row}行` : l.page ? `第${l.page}页` : l.line ? `第${l.line}行` : "";
      return [label, position].filter(Boolean).join(" · ");
    }
    function reportStatus(status) { return reportStatusLabel[status] || "待复核"; }
    function humanActionStatus(status) { return actionStatusLabel[status] || "待处理"; }
    function showToast(message) {
      clearTimeout(toastTimer);
      toastEl.textContent = message;
      toastEl.classList.remove("hidden");
      toastTimer = setTimeout(() => toastEl.classList.add("hidden"), 4200);
    }
    function setLive(message) {
      const live = document.getElementById("live");
      if (live) live.textContent = message || "";
    }
    function friendlyError(error) {
      const text = String(error?.message || "");
      if (text === "NO_SCOPE" || text.includes("scope")) return "这起案件没有明确的处理范围，系统已停止处理。";
      if (text === "NO_TENANT" || text.includes("租户")) return "当前客户信息不完整，系统已停止处理。";
      if (text === "EMPTY" || text.includes("无内容")) return "这份材料没有内容，系统已停止处理。";
      if (/cross_tenant/i.test(text)) return "材料不属于当前客户，系统已停止处理。";
      if (text.includes("auth_required") || text.includes("invalid_token") || text.includes("token_expired")) return "当前登录已失效，请重新登录后再试。";
      if (text.includes("scope_forbidden") || text.includes("tenant_forbidden")) return "当前账号没有这起案件的访问权限。";
      if (text.includes("evidence_source_unavailable")) return "材料来源暂时不可用，系统保留原有结果，没有覆盖旧数据。";
      if (text.includes("outcome_result_and_rationale_required")) return "效果回写需要填写结果和说明。";
      const messages = {
        NO_SCOPE: "这起案件没有明确的处理范围，系统已停止处理。",
        NO_TENANT: "当前客户信息不完整，系统已停止处理。",
        EMPTY: "这份材料没有内容，系统已停止处理。",
        CROSS_TENANT_SOURCE: "材料不属于当前客户，系统已停止处理。",
      };
      return messages[error?.message] || "这起案件暂时无法读取，系统已安全停止处理。";
    }
    const urlToken = new URLSearchParams(location.hash.startsWith("#") ? location.hash.slice(1) : location.search).get("token");
    if (urlToken) window.__AUTH_TOKEN__ = urlToken;
    async function api(path, method = "GET", body) {
      // Demo uses an explicit actor alias; production reads the bearer token from the #token= URL fragment.
      const actor = path.endsWith("/review") ? "quality-owner" : "sales-director";
      const token = window.__AUTH_TOKEN__;

      const copy = actionCopy[nextAction];
      const actionMarkup = nextAction && copy ? actionButton(nextAction, copy[0], copy[1], true, runtime.status) : `<p class="next-action-empty">所有处理步骤已完成，可以查看下方记录。</p>`;
      return `<div class="level-kicker"><span>处理与结案</span><span class="level-kicker-actions"><strong>${escapeHtml(statusLabel[runtime.status] || "待处理")}</strong><button class="level-back" data-level="investigate">← 返回查证</button></span></div><p class="panel-intro">一次只处理当前这一步，完成后再进入下一步。</p><div class="section-stack"><section class="panel"><div class="panel-head"><h3>下一步</h3><span>负责人确认后继续</span></div><div class="panel-body"><div class="action-bar">${actionMarkup}</div></div></section><section class="panel"><div class="panel-head"><h3>处理结果</h3><span>每项动作都要有结果</span></div><div class="panel-body">${renderActions(runtime.actions)}</div></section><section class="panel"><div class="panel-head"><h3>处理记录</h3><span>${runtime.events?.length || 0} 步</span></div><div class="panel-body">${renderTimeline(runtime.events)}</div></section></div>`;
    }
    function renderMonitor(gold, runtime, pack, conflicts, gaps, receipts) {
      const waiting = capabilitySnapshot.counts?.waiting ?? caseRows.filter((row) => ["new", "triaged", "confirmed"].includes(row.status)).length;
      const inProgress = capabilitySnapshot.counts?.inProgress ?? caseRows.filter((row) => ["proposed", "approved", "executed", "verified"].includes(row.status)).length;
      const closed = capabilitySnapshot.counts?.closed ?? caseRows.filter((row) => row.status === "closed").length;
      const gate = gaps ? "材料不足，暂不放行" : conflicts ? "有差异，等待核对" : "材料一致，可以放行";
      return `<div class="module-view"><div class="module-heading"><p class="eyebrow">CAPABILITY · ${moduleMeta.monitor}</p><h3>案件态势总览</h3><p>把当前案件和队列状态放在同一张实时画面里，先看哪里需要人介入。</p></div><div class="module-kpis"><div class="module-kpi alert"><span>待核对案件</span><strong>${waiting}</strong><small>还没有完成事实核对</small></div><div class="module-kpi warn"><span>处理中案件</span><strong>${inProgress}</strong><small>已进入方案或结果阶段</small></div><div class="module-kpi good"><span>已完成案件</span><strong>${closed}</strong><small>有完整处理记录</small></div><div class="module-kpi"><span>当前案件风险</span><strong>${conflicts || gaps ? "需关注" : "正常"}</strong><small>${escapeHtml(gold.id)} · ${escapeHtml(statusLabel[runtime.status] || "待处理")}</small></div></div><div class="decision-grid"><section class="decision-card"><h4>风险闸门</h4><p>${escapeHtml(gate)}。系统只展示判断，不会替你跳过审批或自动结案。</p><div class="decision-actions"><button class="act primary" data-module-action="investigate">去看差异</button><button class="act" data-module-action="resolve">查看处理阶段</button></div></section><section class="decision-card"><h4>当前案件处理摘要</h4><ul class="summary-list"><li><span>依据</span><strong>${pack.evidence?.length || 0} 条</strong></li><li><span>差异</span><strong>${conflicts} 项</strong></li><li><span>结果</span><strong>${escapeHtml(actionProgress(runtime.actions, receipts))}</strong></li></ul></section></div><section class="panel"><div class="panel-head"><h3>决策回放</h3><span>最近处理节点</span></div><div class="panel-body">${renderTimeline(runtime.events)}</div></section></div>`;
    }
    function renderOntology(pack, conflicts, receipts) {
      return `<div class="module-view"><div class="module-heading"><p class="eyebrow">CAPABILITY · ${moduleMeta.ontology}</p><h3>材料如何共同构成一个案件</h3><p>不是把材料平铺出来，而是看见它们分别在事实、差异、资金和客户反馈中的作用。</p></div>${renderRelationMap(conflicts, receipts)}<section class="panel"><div class="panel-head"><h3>案件实体</h3><span>${capabilitySnapshot.evidenceCount ?? pack.evidence?.length ?? 0} 条依据映射</span></div><div class="entity-grid"><div class="entity-card"><strong>报价单</strong><span>承诺的数量、单价和总额</span></div><div class="entity-card"><strong>订单</strong><span>实际下单与交付信息</span></div><div class="entity-card"><strong>回款记录</strong><span>应收和已收金额</span></div><div class="entity-card"><strong>客诉记录</strong><span>索赔、责任和关闭状态</span></div></div></section></div>`;
    }
    function renderAdjudication(report, pack, conflicts) {
      const conclusion = report.conclusion || (conflicts ? "存在需要人工确认的材料差异" : "当前材料没有明显冲突");
      const saved = report.reportDecision ? `已记录：${report.reportDecision.decision} · ${report.reportDecision.rationale}` : "尚未记录人工裁决";
      return `<div class="module-view"><div class="module-heading"><p class="eyebrow">CAPABILITY · ${moduleMeta.adjudication}</p><h3>让结论先经过依据，再进入处理</h3><p>每个判断都能回到原文；裁决只记录人工选择，不会伪装成自动事实。</p></div><div class="decision-grid"><section class="decision-card"><h4>当前裁决</h4><p>${escapeHtml(conclusion)}</p><p class="summary-note">${escapeHtml(saved)}</p><div class="decision-actions"><button class="act primary" data-decision="accept">认可当前结论</button><button class="act" data-decision="supplement">要求补充材料</button><button class="act" data-decision="reject">退回重新核对</button></div></section><section class="decision-card"><h4>裁决边界</h4><p>依据 ${pack.evidence?.length || 0} 条 · 差异 ${conflicts} 项 · 仅对当前案件生效。</p></section></div>${renderReport(report)}</div>`;
    }
    function renderSandbox(gold, runtime, conflicts) {
      return `<div class="module-view"><div class="module-heading"><p class="eyebrow">CAPABILITY · ${moduleMeta.sandbox}</p><h3>先演练，再提交真实处理动作</h3><p>在这里比较不同处理路径的影响，演练不会改变案件状态，也不会写入回执。</p></div><div class="sandbox-grid"><section class="sandbox-card"><h4>选择一个处理情景</h4><p>用当前案件 ${escapeHtml(gold.id)} 演练下一步如何推进。</p><select id="scenario-choice" class="sandbox-select"><option value="evidence">先补齐订单或变更单</option><option value="claim">按订单证据驳回超额索赔</option><option value="hold">暂缓处理，等待负责人确认</option></select><div class="decision-actions"><button class="act primary" data-simulate>运行一次推演</button></div></section><section class="sandbox-card"><h4>推演结果</h4><div id="simulation-output" class="simulation-output">选择情景后，系统会展示预期下一步和需要的人工确认。</div></section></div><section class="panel"><div class="panel-head"><h3>推演约束</h3><span>只读沙盘</span></div><div class="panel-body"><p class="report-summary">当前差异 ${conflicts} 项；案件状态为 ${escapeHtml(statusLabel[runtime.status] || "待处理")}。任何真实动作仍需回到“处理与结案”并经过既有审批闸门。</p></div></section></div>`;
    }
    function renderActionModule(runtime, conflicts) {
      const actions = runtime.actions || [];
      const rows = actions.length ? actions.map((action, index) => `<div class="breakdown-card"><span class="breakdown-index">${index + 1}</span><div><strong>${escapeHtml(actionLabel[action.type] || "跟进这项问题")}</strong><small>负责人：${escapeHtml(action.approvedBy || "待指定")} · 完成条件：${action.receipt ? "已收到回执" : "需要结果说明"}</small></div><span class="breakdown-state">${escapeHtml(humanActionStatus(action.status))}</span></div>`).join("") : `<div class="breakdown-card"><span class="breakdown-index">1</span><div><strong>先根据 ${conflicts} 项差异拟定处理动作</strong><small>明确负责人、完成条件和需要留下的依据。</small></div><span class="breakdown-state">待开始</span></div>`;
      const resolveAllowed = canEnterResolve({ status: runtime.status, conflicts, gaps: caseGate.gaps, reviewedConflictIds: caseGate.reviewedConflictIds, reviewedIssueIds: caseGate.reviewedIssueIds });
      const gapBlocked = !resolveAllowed && (caseGate.gaps || 0) > 0 && !((caseGate.conflicts || 0) - (caseGate.reviewedIssueIds?.length || caseGate.reviewedConflictIds?.length || 0) > 0);
      return `<div class="module-view"><div class="module-heading"><p class="eyebrow">CAPABILITY · ${moduleMeta.actions}</p><h3>把“怎么处理”拆成可交接的动作</h3><p>动作、负责人、完成条件和回执分开呈现，任何一步都能回看。</p></div><div class="action-breakdown">${rows}</div><section class="panel"><div class="panel-head"><h3>下一步建议</h3><span>不会自动执行</span></div><div class="panel-body"><div class="next-step"><div><strong>${actions.length ? "检查每项动作是否都有结果" : gapBlocked ? "材料缺口未补，这类案件不放行" : "先从差异中生成处理方案"}</strong><span>${gapBlocked ? "按“缺口不放行”规则停止推进；完整闭环请改选无缺口案件（如 FX-014、FX-028）。" : "进入案件处理阶段后，仍需负责人确认。"}</span></div><button class="act primary" data-module-action="resolve" ${resolveAllowed ? "" : "disabled"}>${resolveAllowed ? "打开处理阶段" : gapBlocked ? "缺口未补，不放行" : "完成核对后可进入"}</button></div></div></section></div>`;
    }
    function renderMoreCapabilities(runtime, pack, conflicts) {
      const pending = caseRows.filter((row) => ["new", "triaged", "confirmed"].includes(row.status)).length;
      const records = runtime.capabilityRecords || [];
      const recordText = records.length ? records.slice(-4).reverse().map((record) => `<li><strong>${escapeHtml(record.action)}</strong> · ${escapeHtml(record.result || "已记录")} · ${escapeHtml(record.actor || "未知主体")}</li>`).join("") : "<li>暂无能力写回记录</li>";
      return `<div class="module-view"><div class="module-heading"><p class="eyebrow">CAPABILITY · ${moduleMeta.more}</p><h3>从当前案件继续长出更多工作能力</h3><p>这些不是装饰菜单，而是围绕“材料 → 判断 → 动作 → 结果”自然延伸出来的能力。</p></div><div class="capability-grid"><article class="capability-card"><h4>来源版本对照</h4><p>对比不同版本的报价、订单和客诉材料，避免旧版本覆盖新判断。</p><button class="act" data-more-action="versions">查看版本</button></article><article class="capability-card"><h4>人工复核队列</h4><p>把 ${pending} 起仍需人工核对的案件集中出来，按风险逐项处理。</p><button class="act" data-more-action="review">打开队列</button></article><article class="capability-card"><h4>效果回写</h4><p>处理完成后留下结果说明和回执，下一轮判断能看见真实结果，而不是只看状态。</p><button class="act" data-more-action="outcome">记录结果</button></article><article class="capability-card"><h4>权限与审计</h4><p>保留谁查看、谁确认、谁执行的处理轨迹；当前案件已有 ${runtime.events?.length || 0} 个时间节点。</p><button class="act" data-more-action="audit">查看审计</button></article></div><section class="panel"><div class="panel-head"><h3>已写回能力记录</h3><span>${records.length} 条</span></div><div class="panel-body"><ul class="record-list">${recordText}</ul></div></section><section class="panel"><div class="panel-head"><h3>当前能力底座</h3><span>只读概览</span></div><div class="panel-body"><p class="report-summary">${pack.evidence?.length || 0} 条材料已建立来源关系，${conflicts} 项差异等待判断；后续新增能力都应继续复用同一条证据、审批和回执链。</p></div></section></div>`;
    }
    async function reviewConflict(conflictId) {
      if (!conflictId || reviewingConflict) return;
      const targetId = currentId;
      // Review endpoint contract: /api/cases/${encodeURIComponent(currentId)}/review
      reviewingConflict = true;
      view.querySelectorAll("[data-review-conflict]").forEach((button) => { button.disabled = true; });
      try {
        await api(`/api/cases/${encodeURIComponent(targetId)}/review`, "POST", { reviews: [{ conflictId, decision: "acknowledge", rationale: "用户标记已核对" }] });
        showToast("这处差异已标记为已核对");
        if (targetId === currentId) await Promise.all([loadList(), render()]);
      } catch (error) {
        showToast(friendlyError(error));
        if (targetId === currentId) await render();
      } finally {
        reviewingConflict = false;
      }
    }
    async function submitDecision(decision) {
      const targetId = currentId;
      try {
        await api(`/api/cases/${encodeURIComponent(targetId)}/capabilities/adjudication`, "POST", { decision, rationale: { accept: "认可当前证据结论", supplement: "需要补充业务材料", reject: "当前结论需要重新核对" }[decision] || "已记录人工裁决" });
        showToast({ accept: "裁决已保存：认可当前结论", supplement: "裁决已保存：等待补充材料", reject: "裁决已保存：退回重新核对" }[decision] || "裁决已保存");
        if (targetId === currentId) await render();
      } catch (error) {
        showToast(friendlyError(error));
      }
    }
    async function step(action) {
      const targetId = currentId;
      const button = view.querySelector(`[data-action="${action}"]`);
      if (button) button.disabled = true;
      setLive("正在提交动作…");
      try { await api(`/api/cases/${encodeURIComponent(targetId)}/${action}`, "POST"); showToast("这一步已完成"); if (targetId === currentId) { await Promise.all([loadList(), render()]); setLive("这一步已完成"); } }
      catch (error) { showToast(error.message); setLive(`动作失败：${error.message}`); if (targetId === currentId) await render(); }
    }
    async function loadList() {
      caseRows = (await api("/api/cases")).filter((row) => row.pack === "fulfillment");
      if (!caseRows.some((row) => row.id === currentId)) currentId = caseRows[0]?.id || "";
      renderList();
    }
    async function render() {
      const generation = ++renderGeneration;
      const requestedId = currentId;
      const requestedModule = currentModule;
      if (!requestedId) { view.innerHTML = `<p class="empty">暂无案件。</p>`; return; }
      try {
        // Keep the request identity local for the whole render; the shadowed name also documents the API contract.
        let payload;
        {
          const currentId = requestedId;
          const currentModule = requestedModule;
          payload = await Promise.all([api(`/api/cases/${encodeURIComponent(currentId)}`), api(`/api/cases/${encodeURIComponent(currentId)}/report`), api(`/api/cases/${encodeURIComponent(currentId)}/capabilities/${encodeURIComponent(currentModule)}`)]);
        }
        const [{ gold, runtime }, report, capability] = payload;
        if (generation !== renderGeneration || requestedId !== currentId || requestedModule !== currentModule) return;
        capabilitySnapshot = capability;
        const pack = runtime.pack || { evidence: [], conflicts: [], gaps: [] };
        const evById = Object.fromEntries((pack.evidence || []).map((e) => [e.id, e]));
        const conflicts = pack.conflictIssues?.length || pack.conflicts?.length || 0;
        const gaps = pack.gaps?.length || 0;
        const receipts = runtime.actions?.filter((a) => a.receipt || a.status === "verified").length || 0;
        caseGate = { status: runtime.status, conflicts, gaps, reviewedConflictIds: runtime.reviewedConflictIds || [], reviewedIssueIds: runtime.reviewedIssueIds || [], conflictReviews: runtime.conflictReviews || [] };
        if (currentLevel === "resolve" && !canEnterResolve()) currentLevel = "overview";
        const moduleView = requestedModule === "workbench" ? `${renderLevelNav(runtime.status)}<section class="level-panel ${currentLevel === "overview" ? "active" : ""}" data-level-panel="overview">${renderOverview(gold, runtime, report, pack, conflicts, gaps, receipts)}</section><section class="level-panel ${currentLevel === "investigate" ? "active" : ""}" data-level-panel="investigate">${renderInvestigate(pack, evById, report, conflicts, caseGate.reviewedConflictIds, caseGate.conflictReviews, caseGate.reviewedIssueIds)}</section><section class="level-panel ${currentLevel === "resolve" ? "active" : ""}" data-level-panel="resolve">${renderResolve(runtime)}</section>` : requestedModule === "monitor" ? renderMonitor(gold, runtime, pack, conflicts, gaps, receipts) : requestedModule === "ontology" ? renderOntology(pack, conflicts, receipts) : requestedModule === "adjudication" ? renderAdjudication(report, pack, conflicts) : requestedModule === "sandbox" ? renderSandbox(gold, runtime, conflicts) : requestedModule === "actions" ? renderActionModule(runtime, conflicts) : renderMoreCapabilities(runtime, pack, conflicts);
        view.innerHTML = `<div class="content-inner"><div id="live" class="live-region" aria-live="polite"></div><section class="hero"><div><p class="eyebrow">${escapeHtml(gold.id)} · ${escapeHtml(packLabel[gold.pack] || "业务案件")}</p><h2>${escapeHtml(displayTitle(gold.title))}</h2><p class="hero-meta">负责人：${escapeHtml(gold.ownerRole)} · ${escapeHtml(packLabel[gold.pack] || "业务案件")}</p></div><span class="status-pill status-${escapeHtml(runtime.status)}">${escapeHtml(statusLabel[runtime.status] || "待处理")}</span></section>${moduleView}</div>`;
        view.querySelectorAll("[data-level]").forEach((button) => button.addEventListener("click", () => setLevel(button.dataset.level || "overview")));
        view.querySelectorAll("[data-review-conflict]").forEach((button) => button.addEventListener("click", () => void reviewConflict(button.dataset.reviewConflict || "")));
        view.querySelectorAll("[data-relation]").forEach((button) => button.addEventListener("click", () => selectRelation(button.dataset.relation || "core")));
        view.querySelectorAll("[data-module-action]").forEach((button) => button.addEventListener("click", () => setLevel(button.dataset.moduleAction === "resolve" ? "resolve" : "investigate")));
        view.querySelectorAll("[data-decision]").forEach((button) => button.addEventListener("click", () => void submitDecision(button.dataset.decision || "")));
        view.querySelectorAll("[data-more-action]").forEach((button) => button.addEventListener("click", async () => { const targetId = currentId; const action = button.dataset.moreAction || ""; const body = { action, ...(action === "outcome" ? { result: window.prompt("填写处理结果") || "", rationale: "工作台人工回写" } : {}) }; try { await api(`/api/cases/${encodeURIComponent(targetId)}/capabilities/more`, "POST", body); showToast(action === "outcome" ? "效果回写已保存" : "能力操作已保存"); if (targetId === currentId) await render(); } catch (error) { showToast(friendlyError(error)); } }));
        const simulateButton = view.querySelector("[data-simulate]");
        if (simulateButton) simulateButton.addEventListener("click", async () => {
          const targetId = currentId;
          const selected = view.querySelector("#scenario-choice")?.value;
          const output = view.querySelector("#simulation-output");
          try { await api(`/api/cases/${encodeURIComponent(targetId)}/capabilities/sandbox`, "POST", { scenario: selected }); } catch (error) { showToast(friendlyError(error)); return; }
          const result = { evidence: "预期：先补齐订单或变更单，再进入负责人确认。风险：材料不足时不能直接结案。", claim: "预期：按订单数量和回款记录核对索赔金额。风险：客诉依据仍需人工确认。", hold: "预期：案件保持待核对，不产生任何执行回执。风险：处理时限会继续等待。" }[selected] || "请选择一个情景。";
          if (output && targetId === currentId) output.textContent = result;
        });
        view.querySelectorAll("[data-action]").forEach((button) => button.addEventListener("click", () => step(button.dataset.action)));
      } catch (error) {
        if (generation === renderGeneration && requestedId === currentId && requestedModule === currentModule) view.innerHTML = `<p class="empty">${escapeHtml(friendlyError(error))}</p>`;
      }
    }
    searchEl.addEventListener("input", renderList);
    pickerEl.addEventListener("change", () => switchCase(pickerEl.value));
    modulePickerEl.addEventListener("change", () => setModule(modulePickerEl.value));
    document.querySelectorAll("[data-module]").forEach((button) => button.addEventListener("click", () => setModule(button.dataset.module || "workbench")));
    const navGroup = document.getElementById("nav-group");
    const navToggle = document.getElementById("nav-capability-toggle");
    const navMenu = document.getElementById("nav-capability-menu");
    function closeNavMenu() {
      navMenu.hidden = true;
      navGroup.classList.remove("open");
      navToggle.setAttribute("aria-expanded", "false");
    }
    navToggle.addEventListener("click", (event) => {
      event.stopPropagation();
      const open = navMenu.hidden;
      navMenu.hidden = !open;
      navGroup.classList.toggle("open", open);
      navToggle.setAttribute("aria-expanded", String(open));
    });
    navMenu.addEventListener("click", () => closeNavMenu());
    document.addEventListener("click", (event) => {
      if (navMenu.hidden || navGroup.contains(event.target)) return;
      closeNavMenu();
    });
    loadList().then(render).catch((error) => { view.innerHTML = `<p class="empty">${escapeHtml(friendlyError(error))}</p>`; showToast(friendlyError(error)); });
  </script>
</body>
</html>
