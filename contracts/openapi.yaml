openapi: 3.0.3
info:
  title: Fulfillment Exception Pack API
  version: 2.0.0
  description: Local deterministic case/evidence API. Production uses a verified bearer token; demo headers are development-only.
servers:
  - url: http://127.0.0.1:3410
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } }
  /api/cases:
    parameters:
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Case list
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CaseSummary' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/cases/{id}:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Case detail
          content:
            application/json: { schema: { $ref: '#/components/schemas/CaseDetail' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/cases/{id}/report:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Traceable case report
          content:
            application/json: { schema: { $ref: '#/components/schemas/Report' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/cases/{id}/receipts:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Durable external capability receipts
          content:
            application/json:
              schema:
                type: object
                required: [caseId, receipts]
                properties:
                  caseId: { type: string }
                  receipts: { type: array, items: { $ref: '#/components/schemas/CapabilityReceipt' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/cases/{id}/refresh:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Refreshed case and endpoint attempts
          content:
            application/json: { schema: { $ref: '#/components/schemas/RefreshResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /api/cases/{id}/review:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { reviews: { type: array, items: { $ref: '#/components/schemas/ConflictReviewInput' } }, conflictIds: { type: array, items: { type: string } } } }
      responses:
        '200':
          description: Updated case
          content:
            application/json: { schema: { $ref: '#/components/schemas/RuntimeCase' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/cases/{id}/propose:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    post:
      responses:
        '200':
          description: Proposed case
          content:
            application/json: { schema: { $ref: '#/components/schemas/RuntimeCase' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/cases/{id}/approve:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    post:
      responses:
        '200':
          description: Approved case
          content:
            application/json: { schema: { $ref: '#/components/schemas/RuntimeCase' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/cases/{id}/execute:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    post:
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { idempotencyKey: { type: string } } }
      responses:
        '200':
          description: Executed case
          content:
            application/json: { schema: { $ref: '#/components/schemas/RuntimeCase' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/cases/{id}/close:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    post:
      responses:
        '200':
          description: Closed case
          content:
            application/json: { schema: { $ref: '#/components/schemas/RuntimeCase' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/cases/{id}/capabilities/{module}:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/CapabilityModule' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Capability snapshot
          content:
            application/json: { schema: { $ref: '#/components/schemas/CapabilitySnapshot' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/AdjudicationRequest' }
                - { $ref: '#/components/schemas/SandboxRequest' }
                - { $ref: '#/components/schemas/MoreCapabilityRequest' }
      responses:
        '200':
          description: Capability result
          content:
            application/json: { schema: { $ref: '#/components/schemas/CapabilityResponse' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/eval:
    get:
      responses:
        '200':
          description: Synthetic evaluation result
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v2/contexts/{contextId}/replay:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Replayable V2 fulfillment context
          content:
            application/json: { schema: { $ref: '#/components/schemas/V2ReplayResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/contexts/{contextId}/workbench:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Pure-query V2 manufacturing workbench projection
          content:
            application/json: { schema: { $ref: '#/components/schemas/V2ManufacturingWorkbenchResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/analytics/operational:
    parameters:
      - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
      - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      - { name: timeBasis, in: query, required: false, schema: { type: string, enum: [context_opened, exception_occurrence] } }
      - { name: bucket, in: query, required: false, schema: { type: string, enum: [day, week, month] } }
      - { name: contextType, in: query, required: false, schema: { type: string } }
      - { name: exceptionCode, in: query, required: false, schema: { type: string } }
      - { name: severity, in: query, required: false, schema: { type: string, enum: [low, medium, high, critical] } }
      - { name: resolutionStatus, in: query, required: false, schema: { type: string, enum: [no_case, triaged, confirmed, proposed_draft, pending_approval, approved, executed, closed, rejected] } }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Pure-query cross-context Operational Intelligence projection
          content:
            application/json: { schema: { $ref: '#/components/schemas/OperationalAnalyticsResponse' } }
        '400':
          description: Invalid analytics filter
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v2/solution-packs:
    get:
      parameters:
        - { $ref: '#/components/parameters/DemoTenantHeader' }
        - { $ref: '#/components/parameters/DemoActorHeader' }
      responses:
        '200':
          description: Code-packaged Solution Pack catalog
          content:
            application/json: { schema: { $ref: '#/components/schemas/SolutionPackCatalog' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v2/solution-packs/installed:
    get:
      parameters:
        - { $ref: '#/components/parameters/DemoTenantHeader' }
        - { $ref: '#/components/parameters/DemoActorHeader' }
      responses:
        '200':
          description: Installed Solution Packs for current tenant
          content:
            application/json: { schema: { $ref: '#/components/schemas/SolutionPackInstalledList' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v2/solution-packs/{packId}:
    parameters:
      - { name: packId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Solution Pack manifest
          content:
            application/json: { schema: { $ref: '#/components/schemas/SolutionPackManifestResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/solution-packs/{packId}/install:
    parameters:
      - { name: packId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    post:
      requestBody:
        required: false
        content:
          application/json: { schema: { type: object, additionalProperties: false } }
      responses:
        '200':
          description: Idempotent Solution Pack installation
          content:
            application/json: { schema: { $ref: '#/components/schemas/SolutionPackInstallationResponse' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/connectors:
    get:
      responses:
        '200':
          description: Code-packaged Connector catalog
          content:
            application/json:
              schema:
                type: object
                required: [connectors]
                properties:
                  connectors: { type: array, items: { $ref: '#/components/schemas/ConnectorManifest' } }
  /api/v2/connectors/installed:
    parameters:
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Tenant Connector installations, secret values omitted
          content:
            application/json:
              schema:
                type: object
                required: [installations]
                properties:
                  installations: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v2/connectors/{connectorId}/install:
    parameters:
      - { name: connectorId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [installationId, config]
              properties:
                installationId: { type: string }
                config: { type: object, additionalProperties: true }
                secretRef: { type: string, pattern: '^[A-Z0-9_]+$' }
      responses:
        '200':
          description: Connector installation without network call
          content:
            application/json: { schema: { $ref: '#/components/schemas/ConnectorInstallationResponse' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/internal-work-items/{workItemId}/deliveries:
    parameters:
      - { name: workItemId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Connector outbox deliveries for an Internal Work Item
          content:
            application/json:
              schema:
                type: object
                required: [workItemId, deliveries]
                properties:
                  workItemId: { type: string }
                  deliveries: { type: array, items: { $ref: '#/components/schemas/ConnectorDeliveryView' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connectorInstallationId]
              properties:
                connectorInstallationId: { type: string }
      responses:
        '202':
          description: Delivery enqueued to transactional outbox; no HTTP call performed
          content:
            application/json: { schema: { $ref: '#/components/schemas/ConnectorDeliveryView' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/connectors/outbox/{outboxId}:
    parameters:
      - { name: outboxId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Connector outbox and receipt view
          content:
            application/json: { schema: { $ref: '#/components/schemas/ConnectorDeliveryView' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/connectors/outbox/{outboxId}/attempts:
    parameters:
      - { name: outboxId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Safe Connector delivery attempts
          content:
            application/json:
              schema:
                type: object
                required: [outboxId, attempts]
                properties:
                  outboxId: { type: string }
                  attempts: { type: array, items: { $ref: '#/components/schemas/ConnectorDeliveryAttempt' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/contexts/{contextId}/pack-workbench:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Pure-query generic Solution Pack workbench
          content:
            application/json: { schema: { $ref: '#/components/schemas/PackWorkbenchResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/contexts/{contextId}/exceptions:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Deterministic V2 fulfillment exception candidates
          content:
            application/json: { schema: { $ref: '#/components/schemas/V2ExceptionResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/contexts/{contextId}/rule-evaluations:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Persisted V2 rule evaluation snapshots
          content:
            application/json: { schema: { $ref: '#/components/schemas/V2RuleEvaluationsResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/contexts/{contextId}/evaluations/run:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    post:
      responses:
        '200':
          description: Evaluate active rules and upsert stable exceptions
          content:
            application/json: { schema: { $ref: '#/components/schemas/V2EvaluationRunResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/contexts/{contextId}/exceptions/{exceptionId}/explanations:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/V2ExceptionId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Grounded AI explanation summaries for the exception
          content:
            application/json: { schema: { $ref: '#/components/schemas/GroundedExplanationListResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      requestBody:
        required: false
        content:
          application/json: { schema: { type: object, additionalProperties: false } }
      responses:
        '200':
          description: Generated or idempotently reused grounded explanation
          content:
            application/json: { schema: { $ref: '#/components/schemas/GroundedExplanationResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/AIProviderFailure' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /api/v2/outcome-definitions:
    get:
      parameters:
        - { $ref: '#/components/parameters/DemoTenantHeader' }
        - { $ref: '#/components/parameters/DemoActorHeader' }
        - { name: exceptionCode, in: query, schema: { type: string } }
      responses:
        '200':
          description: Enabled and historical Outcome Definitions
          content:
            application/json:
              schema:
                type: object
                required: [definitions]
                properties:
                  definitions: { type: array, items: { $ref: '#/components/schemas/OutcomeDefinition' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v2/contexts/{contextId}/exceptions/{exceptionId}/outcome-evaluations:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/V2ExceptionId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Outcome Evaluation list
          content:
            application/json: { schema: { $ref: '#/components/schemas/OutcomeEvaluationList' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [definitionId, evidenceIds]
              properties:
                definitionId: { type: string }
                evidenceIds: { type: array, items: { type: string } }
                resolutionCaseId: { type: string }
                automationRunId: { type: string }
      responses:
        '200':
          description: Evidence-backed deterministic Outcome Evaluation
          content:
            application/json: { schema: { $ref: '#/components/schemas/OutcomeEvaluation' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v2/contexts/{contextId}/exceptions/{exceptionId}/outcome-evaluations/{outcomeEvaluationId}:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/V2ExceptionId' }
      - { name: outcomeEvaluationId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Outcome Evaluation detail
          content:
            application/json: { schema: { $ref: '#/components/schemas/OutcomeEvaluation' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/contexts/{contextId}/exceptions/{exceptionId}/explanations/{explanationId}:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/V2ExceptionId' }
      - { $ref: '#/components/parameters/GroundedExplanationId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Grounded AI explanation detail with stale status
          content:
            application/json: { schema: { $ref: '#/components/schemas/GroundedExplanationResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/contexts/{contextId}/exceptions/{exceptionId}/decision-recommendations:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/V2ExceptionId' }
