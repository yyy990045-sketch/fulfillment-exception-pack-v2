openapi: 3.0.3
info:
  title: Fulfillment Exception Pack API
  version: 2.0.0
  description: Local deterministic case/evidence API. Production uses a verified bearer token; demo headers are development-only.
servers:
  - url: http://127.0.0.1:3410
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } }
  /api/cases:
    parameters:
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Case list
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CaseSummary' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/cases/{id}:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Case detail
          content:
            application/json: { schema: { $ref: '#/components/schemas/CaseDetail' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/cases/{id}/report:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Traceable case report
          content:
            application/json: { schema: { $ref: '#/components/schemas/Report' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/cases/{id}/receipts:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Durable external capability receipts
          content:
            application/json:
              schema:
                type: object
                required: [caseId, receipts]
                properties:
                  caseId: { type: string }
                  receipts: { type: array, items: { $ref: '#/components/schemas/CapabilityReceipt' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/cases/{id}/refresh:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Refreshed case and endpoint attempts
          content:
            application/json: { schema: { $ref: '#/components/schemas/RefreshResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /api/cases/{id}/review:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { reviews: { type: array, items: { $ref: '#/components/schemas/ConflictReviewInput' } }, conflictIds: { type: array, items: { type: string } } } }
      responses:
        '200':
          description: Updated case
          content:
            application/json: { schema: { $ref: '#/components/schemas/RuntimeCase' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/cases/{id}/propose:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    post:
      responses:
        '200':
          description: Proposed case
          content:
            application/json: { schema: { $ref: '#/components/schemas/RuntimeCase' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/cases/{id}/approve:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    post:
      responses:
        '200':
          description: Approved case
          content:
            application/json: { schema: { $ref: '#/components/schemas/RuntimeCase' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/cases/{id}/execute:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    post:
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { idempotencyKey: { type: string } } }
      responses:
        '200':
          description: Executed case
          content:
            application/json: { schema: { $ref: '#/components/schemas/RuntimeCase' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/cases/{id}/close:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    post:
      responses:
        '200':
          description: Closed case
          content:
            application/json: { schema: { $ref: '#/components/schemas/RuntimeCase' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/cases/{id}/capabilities/{module}:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/CapabilityModule' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Capability snapshot
          content:
            application/json: { schema: { $ref: '#/components/schemas/CapabilitySnapshot' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/AdjudicationRequest' }
                - { $ref: '#/components/schemas/SandboxRequest' }
                - { $ref: '#/components/schemas/MoreCapabilityRequest' }
      responses:
        '200':
          description: Capability result
          content:
            application/json: { schema: { $ref: '#/components/schemas/CapabilityResponse' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/eval:
    get:
      responses:
        '200':
          description: Synthetic evaluation result
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v2/contexts/{contextId}/replay:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Replayable V2 fulfillment context
          content:
            application/json: { schema: { $ref: '#/components/schemas/V2ReplayResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/contexts/{contextId}/workbench:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Pure-query V2 manufacturing workbench projection
          content:
            application/json: { schema: { $ref: '#/components/schemas/V2ManufacturingWorkbenchResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/analytics/operational:
    parameters:
      - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
      - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      - { name: bucket, in: query, required: false, schema: { type: string, enum: [day, week, month] } }
      - { name: contextType, in: query, required: false, schema: { type: string } }
      - { name: exceptionCode, in: query, required: false, schema: { type: string } }
      - { name: severity, in: query, required: false, schema: { type: string, enum: [low, medium, high, critical] } }
      - { name: resolutionStatus, in: query, required: false, schema: { type: string, enum: [no_case, triaged, confirmed, proposed_draft, pending_approval, approved, executed, closed, rejected] } }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Pure-query cross-context Operational Intelligence projection
          content:
            application/json: { schema: { $ref: '#/components/schemas/OperationalAnalyticsResponse' } }
        '400':
          description: Invalid analytics filter
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v2/contexts/{contextId}/exceptions:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Deterministic V2 fulfillment exception candidates
          content:
            application/json: { schema: { $ref: '#/components/schemas/V2ExceptionResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/contexts/{contextId}/rule-evaluations:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Persisted V2 rule evaluation snapshots
          content:
            application/json: { schema: { $ref: '#/components/schemas/V2RuleEvaluationsResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/contexts/{contextId}/evaluations/run:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    post:
      responses:
        '200':
          description: Evaluate active rules and upsert stable exceptions
          content:
            application/json: { schema: { $ref: '#/components/schemas/V2EvaluationRunResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/contexts/{contextId}/exceptions/{exceptionId}/explanations:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/V2ExceptionId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Grounded AI explanation summaries for the exception
          content:
            application/json: { schema: { $ref: '#/components/schemas/GroundedExplanationListResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      requestBody:
        required: false
        content:
          application/json: { schema: { type: object, additionalProperties: false } }
      responses:
        '200':
          description: Generated or idempotently reused grounded explanation
          content:
            application/json: { schema: { $ref: '#/components/schemas/GroundedExplanationResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/AIProviderFailure' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /api/v2/contexts/{contextId}/exceptions/{exceptionId}/explanations/{explanationId}:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/V2ExceptionId' }
      - { $ref: '#/components/parameters/GroundedExplanationId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Grounded AI explanation detail with stale status
          content:
            application/json: { schema: { $ref: '#/components/schemas/GroundedExplanationResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/contexts/{contextId}/exceptions/{exceptionId}/decision-recommendations:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/V2ExceptionId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Decision Recommendation summaries
          content:
            application/json: { schema: { $ref: '#/components/schemas/DecisionRecommendationList' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      requestBody:
        required: false
        content:
          application/json: { schema: { type: object, additionalProperties: false } }
      responses:
        '200':
          description: Generated or idempotently reused Decision Recommendation
          content:
            application/json: { schema: { $ref: '#/components/schemas/DecisionRecommendation' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/AIProviderFailure' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /api/v2/contexts/{contextId}/exceptions/{exceptionId}/decision-recommendations/{recommendationId}:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/V2ExceptionId' }
      - { name: recommendationId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Decision Recommendation detail with stale status
          content:
            application/json: { schema: { $ref: '#/components/schemas/DecisionRecommendation' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/contexts/{contextId}/exceptions/{exceptionId}/decision-recommendations/{recommendationId}/dispositions:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/V2ExceptionId' }
      - { name: recommendationId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Human dispositions for a Decision Recommendation
          content:
            application/json: { schema: { $ref: '#/components/schemas/DecisionRecommendationDispositionList' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, rationale]
              properties:
                decision: { type: string, enum: [accepted, modified, rejected] }
                selectedOptionId: { type: string }
                rationale: { type: string, minLength: 1 }
      responses:
        '200':
          description: Append-only human disposition
          content:
            application/json: { schema: { $ref: '#/components/schemas/DecisionRecommendationDisposition' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v2/contexts/{contextId}/exceptions/{exceptionId}/bundle:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/V2ExceptionId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    get:
      responses:
        '200':
          description: Exception evidence bundle
          content:
            application/json: { schema: { $ref: '#/components/schemas/V2ExceptionEvidenceBundle' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/contexts/{contextId}/exceptions/{exceptionId}/resolution-case:
    parameters:
      - { $ref: '#/components/parameters/V2ContextId' }
      - { $ref: '#/components/parameters/V2ExceptionId' }
      - { $ref: '#/components/parameters/DemoTenantHeader' }
      - { $ref: '#/components/parameters/DemoActorHeader' }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolutionAcceptanceRequest' }
      responses:
        '200':
          description: Human acceptance mutation; creates a triaged Resolution Case and freezes intake lineage and Evidence references
          content:
            application/json: { schema: { $ref: '#/components/schemas/ResolutionCase' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v2/contexts/{contextId}/resolution-cases:
    get:
      parameters:
        - { $ref: '#/components/parameters/V2ContextId' }
        - { $ref: '#/components/parameters/DemoTenantHeader' }
        - { $ref: '#/components/parameters/DemoActorHeader' }
      responses:
        '200':
          description: Resolution Case summaries for a V2 context
          content:
            application/json: { schema: { $ref: '#/components/schemas/ResolutionCaseListResponse' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/resolution-cases/{caseId}/review:
    post:
      parameters:
        - { $ref: '#/components/parameters/ResolutionCaseId' }
        - { $ref: '#/components/parameters/DemoTenantHeader' }
        - { $ref: '#/components/parameters/DemoActorHeader' }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ResolutionReviewRequest' } }
      responses:
        '200':
          description: Human review mutation; confirm advances to confirmed, needs_evidence remains triaged, reject is terminal
          content:
            application/json: { schema: { $ref: '#/components/schemas/ResolutionCase' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/resolution-cases/{caseId}/propose:
    post:
      parameters:
        - { $ref: '#/components/parameters/ResolutionCaseId' }
        - { $ref: '#/components/parameters/DemoTenantHeader' }
        - { $ref: '#/components/parameters/DemoActorHeader' }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ResolutionProposalRequest' } }
      responses:
        '200':
          description: Human proposal mutation; creates human-authored actions in draft status
          content:
            application/json: { schema: { $ref: '#/components/schemas/ResolutionCase' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/resolution-cases/{caseId}/submit:
    post:
      parameters:
        - { $ref: '#/components/parameters/ResolutionCaseId' }
        - { $ref: '#/components/parameters/DemoTenantHeader' }
        - { $ref: '#/components/parameters/DemoActorHeader' }
      responses:
        '200':
          description: Human submit mutation; actions become pending_approval while the outer Case remains proposed
          content:
            application/json: { schema: { $ref: '#/components/schemas/ResolutionCase' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/resolution-cases/{caseId}:
    get:
      parameters:
        - { $ref: '#/components/parameters/ResolutionCaseId' }
        - { $ref: '#/components/parameters/DemoTenantHeader' }
        - { $ref: '#/components/parameters/DemoActorHeader' }
      responses:
        '200':
          description: Resolution Case query with source drift and receipts
          content:
            application/json: { schema: { $ref: '#/components/schemas/ResolutionCaseQuery' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/resolution-cases/{caseId}/approve:
    post:
      parameters:
        - { $ref: '#/components/parameters/ResolutionCaseId' }
        - { $ref: '#/components/parameters/DemoTenantHeader' }
        - { $ref: '#/components/parameters/DemoActorHeader' }
      responses:
        '200':
          description: Auth-role and segregation-of-duties protected approval mutation
          content:
            application/json: { schema: { $ref: '#/components/schemas/ResolutionCase' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/resolution-cases/{caseId}/execute:
    post:
      parameters:
        - { $ref: '#/components/parameters/ResolutionCaseId' }
        - { $ref: '#/components/parameters/DemoTenantHeader' }
        - { $ref: '#/components/parameters/DemoActorHeader' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { idempotencyKey: { type: string } }
      responses:
        '200':
          description: Local-ledger demo execution; records idempotent receipts without calling a real ERP/WMS
          content:
            application/json: { schema: { $ref: '#/components/schemas/ResolutionCase' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/resolution-cases/{caseId}/close:
    post:
      parameters:
        - { $ref: '#/components/parameters/ResolutionCaseId' }
        - { $ref: '#/components/parameters/DemoTenantHeader' }
        - { $ref: '#/components/parameters/DemoActorHeader' }
      responses:
        '200':
          description: Receipt-gated verification and closure; the source Exception remains detected
          content:
            application/json: { schema: { $ref: '#/components/schemas/ResolutionCase' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    CaseId: { name: id, in: path, required: true, schema: { type: string } }
    CapabilityModule: { name: module, in: path, required: true, schema: { type: string, enum: [workbench, monitor, ontology, adjudication, sandbox, actions, more] } }
    V2ContextId: { name: contextId, in: path, required: true, schema: { type: string } }
    V2ExceptionId: { name: exceptionId, in: path, required: true, schema: { type: string } }
    GroundedExplanationId: { name: explanationId, in: path, required: true, schema: { type: string } }
    ResolutionCaseId: { name: caseId, in: path, required: true, schema: { type: string } }
    DemoTenantHeader:
      name: x-tenant-id
      in: header
      required: false
      description: Development-only tenant selector. Ignored when a bearer token supplies tenant_id.
      schema: { type: string, example: demo-tenant }
    DemoActorHeader:
      name: x-actor
      in: header
      required: false
      description: Development-only actor selector for demo writes. Production uses the bearer subject.
      schema: { type: string, example: demo-operator }
  responses:
    Unauthorized:
      description: Authentication required
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Tenant, scope, or role is not authorized
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: State transition or review gate rejected
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unprocessable:
      description: Invalid business data, grounding validation failure, or AI_PROVIDER_REFUSAL
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadGateway:
      description: All evidence endpoints unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorWithAttempts' } } }
    AIProviderFailure:
      description: Grounded AI provider failed or returned invalid structured output
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServiceUnavailable:
      description: No grounded AI provider is configured for the current runtime mode
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    GatewayTimeout:
      description: Grounded AI provider timed out
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    ErrorWithAttempts:
      allOf:
        - { $ref: '#/components/schemas/Error' }
        - type: object
          properties:
            attempts: { type: array, items: { $ref: '#/components/schemas/EvidenceSourceAttempt' } }
    HealthResponse:
      type: object
      required: [ok]
      properties: { ok: { type: boolean } }
    CaseSummary:
      type: object
      required: [id, title, pack, ownerRole, status]
      properties:
        id: { type: string }
        title: { type: string }
        pack: { type: string, enum: [fulfillment, it-ops] }
        ownerRole: { type: string }
        status: { type: string }
    CaseDetail:
      type: object
      required: [gold, runtime]
      properties:
        gold: { type: object, additionalProperties: true }
        runtime: { $ref: '#/components/schemas/RuntimeCase' }
    RuntimeCase:
      type: object
      required: [id, tenantId, status, events, findings, actions]
      properties:
        id: { type: string }
        tenantId: { type: string }
        status: { type: string }
        paused: { type: boolean }
        pack: { type: object, additionalProperties: true }
        findings: { type: array, items: { type: object, additionalProperties: true } }
        actions: { type: array, items: { type: object, additionalProperties: true } }
        events: { type: array, items: { type: object, additionalProperties: true } }
        capabilityRecords: { type: array, items: { $ref: '#/components/schemas/CapabilityRecord' } }
    Report:
      type: object
      additionalProperties: true
    RefreshResponse:
      type: object
      required: [ok, selectedSourceId, attempts, runtime]
      properties:
        ok: { type: boolean }
        selectedSourceId: { type: string }
        attempts: { type: array, items: { $ref: '#/components/schemas/EvidenceSourceAttempt' } }
        runtime: { $ref: '#/components/schemas/RuntimeCase' }
    EvidenceSourceAttempt:
      type: object
      required: [endpointId, outcome, durationMs]
      properties:
        endpointId: { type: string }
        status: { type: integer }
        outcome: { type: string, enum: [selected, fallback, failed] }
        errorCode: { type: string, enum: [timeout, network, http, invalid_csv, invalid_payload, empty] }
        durationMs: { type: integer, minimum: 0 }
        contentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
    CapabilityRecord:
      type: object
      required: [action, status, actor, at]
      properties:
        action: { type: string, enum: [versions, review, outcome, audit] }
        status: { type: string, enum: [recorded, pending] }
        result: { type: string }
        rationale: { type: string }
        actor: { type: string }
        at: { type: string, format: date-time }
        receipt: { type: string }
        externalRequestId: { type: string }
        receiptSource: { type: string, enum: [local-ledger] }
    CapabilityReceipt:
      type: object
      required: [tenantId, caseId, actionId, operationKey, externalRequestId, receipt, receiptSource, status, payloadHash, createdAt]
      properties:
        tenantId: { type: string }
        caseId: { type: string }
        actionId: { type: string }
        operationKey: { type: string }
        externalRequestId: { type: string }
        receipt: { type: string }
        receiptSource: { type: string, enum: [local-ledger] }
        status: { type: string, enum: [succeeded, failed] }
        payloadHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        createdAt: { type: string, format: date-time }
    CapabilitySnapshot:
      type: object
      required: [module, caseId]
      properties:
        module: { type: string }
        caseId: { type: string }
        records: { type: array, items: { $ref: '#/components/schemas/CapabilityRecord' } }
        report: { type: object, additionalProperties: true }
        actions: { type: array, items: { type: object, additionalProperties: true } }
        scenarios: { type: array, items: { type: object, additionalProperties: true } }
    CapabilityResponse:
      type: object
      additionalProperties: true
      properties:
        ok: { type: boolean }
        action: { type: string }
        scenario: { type: string }
        record: { $ref: '#/components/schemas/CapabilityRecord' }
        runtime: { $ref: '#/components/schemas/RuntimeCase' }
    EvalResponse:
      type: object
      additionalProperties: true
      properties:
        contestCases: { type: integer }
        fxCases: { type: integer }
        failures: { type: array, items: { type: object, additionalProperties: true } }
    V2ReplayResponse:
      type: object
      required: [context, entities, entityReferences, sourceSystems, documents, events, evidence]
      properties:
        context: { type: object, additionalProperties: true }
        entities: { type: array, items: { type: object, additionalProperties: true } }
        entityReferences: { type: array, items: { type: object, additionalProperties: true } }
        sourceSystems: { type: array, items: { type: object, additionalProperties: true } }
        documents: { type: array, items: { type: object, additionalProperties: true } }
        events: { type: array, items: { type: object, additionalProperties: true } }
        evidence: { type: array, items: { type: object, additionalProperties: true } }
    V2ExceptionResponse:
      type: object
      required: [contextId, exceptions]
      properties:
        contextId: { type: string }
        exceptions: { type: array, items: { type: object, additionalProperties: true } }
    V2RuleEvaluationsResponse:
      type: object
      required: [contextId, evaluations]
      properties:
        contextId: { type: string }
        evaluations: { type: array, items: { type: object, additionalProperties: true } }
    V2EvaluationRunResponse:
      type: object
      required: [contextId, evaluations, exceptions]
      properties:
        contextId: { type: string }
        evaluations: { type: array, items: { type: object, additionalProperties: true } }
        exceptions: { type: array, items: { type: object, additionalProperties: true } }
    V2ExceptionEvidenceBundle:
      type: object
      required: [id, tenantId, contextId, exceptionId, observations, evidenceIds, evidence, sourceDocuments, sourceSystems]
      properties:
        id: { type: string }
        tenantId: { type: string }
        contextId: { type: string }
        exceptionId: { type: string }
        observations: { type: object, additionalProperties: true }
        evidenceIds: { type: array, items: { type: string } }
        evidence: { type: array, items: { type: object, additionalProperties: true } }
        sourceDocuments: { type: array, items: { type: object, additionalProperties: true } }
        sourceSystems: { type: array, items: { type: object, additionalProperties: true } }
    V2ManufacturingWorkbenchResponse:
      type: object
      required: [context, stats, thread, rules, exceptions, resolutionCases, truthfulness]
      properties:
        context: { type: object, additionalProperties: true }
        stats:
          type: object
          additionalProperties: true
          required: [sourceSystems, entities, documents, events, evidence, ruleEvaluations, matchedRules, notMatchedRules, exceptions, resolutionCases]
        thread: { type: array, items: { type: object, additionalProperties: true } }
        rules: { type: array, items: { type: object, additionalProperties: true } }
        exceptions: { type: array, items: { type: object, additionalProperties: true } }
        resolutionCases: { type: array, items: { type: object, additionalProperties: true } }
        truthfulness: { type: object, additionalProperties: true }
        defaultExceptionId: { type: string, nullable: true }
    OperationalAnalyticsResponse:
      type: object
      required: [window, summary, exceptionTrend, exceptionBreakdown, severityBreakdown, resolutionFunnel, rulePerformance, actionBreakdown, sourceSystemInvolvement, contexts, metricDefinitions, truthfulness]
      properties:
        window:
          type: object
          required: [from, to, bucket, timeBasis, trendTimeBasis]
          additionalProperties: false
          properties:
            from: { type: string, nullable: true }
            to: { type: string, nullable: true }
            bucket: { type: string, enum: [day, week, month] }
            timeBasis: { type: string, enum: [context.openedAt] }
            trendTimeBasis: { type: string, enum: [exceptionOccurrenceAt] }
        summary:
          type: object
          required: [contextCount, ruleEvaluationCount, matchedRuleEvaluationCount, notMatchedRuleEvaluationCount, detectedExceptionCount, exceptionsWithResolutionCase, exceptionsWithoutResolutionCase, resolutionCaseCount, closedResolutionCaseCount, rejectedResolutionCaseCount, receiptCount, actionCount, verifiedActionCount, governanceCoverageRate, resolutionClosureRate]
          additionalProperties: false
          properties:
            contextCount: { type: integer }
            ruleEvaluationCount: { type: integer }
            matchedRuleEvaluationCount: { type: integer }
            notMatchedRuleEvaluationCount: { type: integer }
            detectedExceptionCount: { type: integer }
            exceptionsWithResolutionCase: { type: integer }
            exceptionsWithoutResolutionCase: { type: integer }
            resolutionCaseCount: { type: integer }
            closedResolutionCaseCount: { type: integer }
            rejectedResolutionCaseCount: { type: integer }
            receiptCount: { type: integer }
            actionCount: { type: integer }
            verifiedActionCount: { type: integer }
            governanceCoverageRate: { type: number, nullable: true }
            resolutionClosureRate: { type: number, nullable: true }
        exceptionTrend:
          type: array
          items:
            type: object
            required: [bucket, exceptionCount, contextsWithException]
            properties:
              bucket: { type: string }
              exceptionCount: { type: integer }
              contextsWithException: { type: integer }
        exceptionBreakdown:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, label, count, severityBreakdown, contextsInvolved, resolutionCaseCount, closedResolutionCaseCount]
            properties:
              code: { type: string }
              label: { type: string }
              count: { type: integer }
              severityBreakdown: { type: object, additionalProperties: true }
              contextsInvolved: { type: array, items: { type: string } }
              resolutionCaseCount: { type: integer }
              closedResolutionCaseCount: { type: integer }
        severityBreakdown:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [severity, count]
            properties:
              severity: { type: string, enum: [low, medium, high, critical] }
              count: { type: integer }
        resolutionFunnel:
          type: object
          required: [no_case, triaged, confirmed, proposed_draft, pending_approval, approved, executed, closed, rejected]
          additionalProperties: false
          properties:
            no_case: { type: integer }
            triaged: { type: integer }
            confirmed: { type: integer }
            proposed_draft: { type: integer }
            pending_approval: { type: integer }
            approved: { type: integer }
            executed: { type: integer }
            closed: { type: integer }
            rejected: { type: integer }
        rulePerformance:
          type: array
          items:
            type: object
            required: [ruleId, code, label, evaluations, matched, notMatched, triggerRate]
            properties:
              ruleId: { type: string }
              code: { type: string }
              label: { type: string }
              evaluations: { type: integer }
              matched: { type: integer }
              notMatched: { type: integer }
              triggerRate: { type: number, nullable: true }
        actionBreakdown:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type, total, draft, pending_approval, authorized, succeeded, verified, failed]
            properties:
              type: { type: string, enum: [supplement_evidence, urge_follow_up, reject_overclaim, review_quotation, create_task] }
              total: { type: integer }
              draft: { type: integer }
              pending_approval: { type: integer }
              authorized: { type: integer }
              succeeded: { type: integer }
              verified: { type: integer }
              failed: { type: integer }
        sourceSystemInvolvement:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [sourceSystemId, name, systemType, involvedExceptionCount]
            properties:
              sourceSystemId: { type: string }
              name: { type: string }
              systemType: { type: string }
              involvedExceptionCount: { type: integer }
        contexts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [contextId, businessKey, contextType, status, openedAt, ruleEvaluationCount, exceptionCount, exceptionCodes, resolutionCaseCount, resolutionStatuses, sourceSystemIds]
            properties:
              contextId: { type: string }
              businessKey: { type: string }
              contextType: { type: string }
              status: { type: string }
              openedAt: { type: string, format: date-time }
              ruleEvaluationCount: { type: integer }
              exceptionCount: { type: integer }
              exceptionCodes: { type: array, items: { type: string } }
              resolutionCaseCount: { type: integer }
              resolutionStatuses: { type: array, items: { type: string } }
              sourceSystemIds: { type: array, items: { type: string } }
        metricDefinitions:
          type: object
          additionalProperties: false
          required: [governanceCoverageRate, resolutionClosureRate, ruleTriggerRate, exceptionOccurrenceAt, sourceSystemInvolvement]
          properties:
            governanceCoverageRate: { type: string }
            resolutionClosureRate: { type: string }
            ruleTriggerRate: { type: string }
            exceptionOccurrenceAt: { type: string }
            sourceSystemInvolvement: { type: string }
        truthfulness:
          type: object
          additionalProperties: false
          required: [derivedFromDomainFacts, realBusinessOutcomeMeasured, financialImpactMeasured, ruleAccuracyMeasured, aiDecisionQualityMeasured, realExternalExecutionMeasured]
          properties:
            derivedFromDomainFacts: { type: boolean }
            realBusinessOutcomeMeasured: { type: boolean }
            financialImpactMeasured: { type: boolean }
            ruleAccuracyMeasured: { type: boolean }
            aiDecisionQualityMeasured: { type: boolean }
            realExternalExecutionMeasured: { type: boolean }
    GroundedExplanation:
      type: object
      required: [id, tenantId, contextId, exceptionId, ruleEvaluationId, inputSnapshotHash, provider, model, status, output, validation, createdBy, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        contextId: { type: string }
        exceptionId: { type: string }
        ruleEvaluationId: { type: string }
        inputSnapshotHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        provider: { type: string }
        model: { type: string }
        status: { type: string, enum: [generated, rejected] }
        output: { type: object, additionalProperties: true }
        validation: { type: object, additionalProperties: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    GroundedExplanationSummary:
      type: object
      required: [id, tenantId, contextId, exceptionId, ruleEvaluationId, inputSnapshotHash, provider, model, status, createdBy, createdAt, stale]
      additionalProperties: true
    GroundedExplanationResponse:
      type: object
      required: [explanation, stale]
      properties:
        explanation: { $ref: '#/components/schemas/GroundedExplanation' }
        stale: { type: boolean }
    GroundedExplanationListResponse:
      type: object
      required: [contextId, exceptionId, explanations]
      properties:
        contextId: { type: string }
        exceptionId: { type: string }
        explanations: { type: array, items: { $ref: '#/components/schemas/GroundedExplanationSummary' } }
    DecisionRecommendationSupportingFact:
      type: object
      additionalProperties: false
      required: [kind, key, value, evidenceIds]
      properties:
        kind: { type: string, enum: [expected, actual, metric, source_fact] }
        key: { type: string }
        value:
          anyOf:
            - { type: string }
            - { type: number }
        evidenceIds: { type: array, items: { type: string } }
    DecisionRecommendationHistoryClaim:
      type: object
      additionalProperties: false
      required: [key, value, statement]
      properties:
        key: { type: string }
        value:
          anyOf:
            - { type: string }
            - { type: number }
        statement: { type: string }
    DecisionRecommendationValidation:
      type: object
      additionalProperties: false
      required: [valid, citationErrors, numericErrors, historyErrors, eligibilityErrors, unsupportedClaims, schemaErrors, validatedAt]
      properties:
        valid: { type: boolean }
        citationErrors: { type: array, items: { type: string } }
        numericErrors: { type: array, items: { type: string } }
        historyErrors: { type: array, items: { type: string } }
        eligibilityErrors: { type: array, items: { type: string } }
        unsupportedClaims: { type: array, items: { type: string } }
        schemaErrors: { type: array, items: { type: string } }
        validatedAt: { type: string, format: date-time }
    DecisionRecommendationOption:
      type: object
      additionalProperties: false
      required: [id, actionType, title, actionSummary, rationale, evidenceIds, supportingFacts, historyClaims, assumptions, missingEvidence]
      properties:
        id: { type: string }
        actionType: { type: string, enum: [supplement_evidence, urge_follow_up, reject_overclaim, review_quotation, create_task] }
        title: { type: string }
        actionSummary: { type: string }
        rationale: { type: string }
        evidenceIds: { type: array, items: { type: string } }
        supportingFacts: { type: array, items: { $ref: '#/components/schemas/DecisionRecommendationSupportingFact' } }
        historyClaims: { type: array, items: { $ref: '#/components/schemas/DecisionRecommendationHistoryClaim' } }
        assumptions: { type: array, items: { type: string } }
        missingEvidence: { type: array, items: { type: string } }
    DecisionRecommendationSummary:
      type: object
      additionalProperties: false
      required: [id, tenantId, contextId, exceptionId, ruleEvaluationId, inputSnapshotHash, provider, model, status, createdBy, createdAt, stale]
      properties:
        id: { type: string }
        tenantId: { type: string }
        contextId: { type: string }
        exceptionId: { type: string }
        ruleEvaluationId: { type: string }
        inputSnapshotHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        provider: { type: string }
        model: { type: string }
        status: { type: string, enum: [generated, rejected] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        stale: { type: boolean }
    DecisionRecommendation:
      type: object
      additionalProperties: false
      required: [id, tenantId, contextId, exceptionId, ruleEvaluationId, inputSnapshotHash, provider, model, status, output, validation, historySnapshot, eligibility, createdBy, createdAt, stale]
      properties:
        id: { type: string }
        tenantId: { type: string }
        contextId: { type: string }
        exceptionId: { type: string }
        ruleEvaluationId: { type: string }
        inputSnapshotHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        provider: { type: string }
        model: { type: string }
        status: { type: string, enum: [generated, rejected] }
        output:
          type: object
          required: [executiveSummary, recommendedOptionId, options, uncertainties, humanDecisionRequired, prohibitedConclusions]
          properties:
            executiveSummary: { type: string }
            recommendedOptionId: { type: string }
            options: { type: array, minItems: 1, maxItems: 3, items: { $ref: '#/components/schemas/DecisionRecommendationOption' } }
            uncertainties: { type: array, items: { type: string } }
            humanDecisionRequired: { type: boolean, enum: [true] }
            prohibitedConclusions: { type: array, items: { type: string } }
        validation: { $ref: '#/components/schemas/DecisionRecommendationValidation' }
        historySnapshot:
          type: object
          additionalProperties: false
          required: [sameExceptionCount, sameExceptionWithResolutionCount, actionTypeCounts, resolutionStatusCounts, closedResolutionCaseCount, rejectedResolutionCaseCount, outcomeMeasured]
          properties:
            sameExceptionCount: { type: integer, minimum: 0 }
            sameExceptionWithResolutionCount: { type: integer, minimum: 0 }
            actionTypeCounts:
              type: object
              additionalProperties: false
              required: [supplement_evidence, urge_follow_up, reject_overclaim, review_quotation, create_task]
              properties:
                supplement_evidence: { type: integer, minimum: 0 }
                urge_follow_up: { type: integer, minimum: 0 }
                reject_overclaim: { type: integer, minimum: 0 }
                review_quotation: { type: integer, minimum: 0 }
                create_task: { type: integer, minimum: 0 }
            resolutionStatusCounts: { type: object, additionalProperties: { type: integer, minimum: 0 } }
            closedResolutionCaseCount: { type: integer, minimum: 0 }
            rejectedResolutionCaseCount: { type: integer, minimum: 0 }
            outcomeMeasured: { type: boolean, enum: [false] }
        eligibility:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [actionType, eligible, reason]
            properties:
              actionType: { type: string, enum: [supplement_evidence, urge_follow_up, reject_overclaim, review_quotation, create_task] }
              eligible: { type: boolean }
              reason: { type: string }
        stale: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    DecisionRecommendationList:
      type: object
      required: [contextId, exceptionId, recommendations]
      properties:
        contextId: { type: string }
        exceptionId: { type: string }
        recommendations: { type: array, items: { $ref: '#/components/schemas/DecisionRecommendationSummary' } }
    DecisionRecommendationDisposition:
      type: object
      additionalProperties: false
      required: [id, tenantId, recommendationId, exceptionId, decision, rationale, actor, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        recommendationId: { type: string }
        exceptionId: { type: string }
        decision: { type: string, enum: [accepted, modified, rejected] }
        selectedOptionId: { type: string }
        rationale: { type: string }
        actor: { type: string }
        createdAt: { type: string, format: date-time }
    DecisionRecommendationDispositionList:
      type: object
      required: [recommendationId, dispositions]
      properties:
        recommendationId: { type: string }
        dispositions: { type: array, items: { $ref: '#/components/schemas/DecisionRecommendationDisposition' } }
    ResolutionAcceptanceRequest:
      type: object
      required: [ownerRole, rationale]
      properties:
        ownerRole: { type: string, minLength: 1 }
        rationale: { type: string, minLength: 1 }
    ResolutionReviewRequest:
      type: object
      required: [decision, rationale]
      properties:
        decision: { type: string, enum: [confirm, needs_evidence, reject] }
        rationale: { type: string, minLength: 1 }
    ResolutionProposalRequest:
      type: object
      required: [actions]
      properties:
        actions:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, summary]
            properties:
              type: { type: string, enum: [supplement_evidence, urge_follow_up, reject_overclaim, review_quotation, create_task] }
              summary: { type: string, minLength: 1 }
    ResolutionCase:
      type: object
      additionalProperties: true
      required: [id, tenantId, contextId, exceptionId, status, ownerRole, origin, runtime]
    ResolutionCaseQuery:
      type: object
      additionalProperties: true
      required: [resolutionCase, sourceException, sourceChanged, intakeEvaluationId, currentEvaluationId, evidenceBundle, receipts]
    ResolutionCaseListResponse:
      type: object
      required: [contextId, resolutionCases]
      properties:
        contextId: { type: string }
        resolutionCases:
          type: array
          items:
            type: object
            required: [id, exceptionId, status, ownerRole, title, createdAt, updatedAt]
    RefreshRequest:
      type: object
      required: [endpoints]
      properties:
        endpoints: { type: array, minItems: 1, items: { type: object, required: [id, url], properties: { id: { type: string }, url: { type: string, format: uri } } } }
