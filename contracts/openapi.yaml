        tenantId: { type: string }
        organization: { type: string }
        organizationSource: { type: string, enum: [demo, claim, tenant_fallback] }
        user: { type: string }
        subjectId: { type: string }
        roles: { type: array, items: { type: string } }
        authnMethod: { type: string, enum: [demo-header, jwt-hs256] }
    CurrentActorContextResponse:
      type: object
      additionalProperties: false
      required: [currentActor]
      properties:
        currentActor: { $ref: '#/components/schemas/CurrentActorContext' }
        demoWorkspace: { $ref: '#/components/schemas/DemoWorkspaceProjection' }
    GovernanceStage:
      type: string
      enum: [not_started, review, proposal, proposal_draft, pending_approval, approved, executed, closed, rejected]
    DemoWorkspaceProjection:
      type: object
      additionalProperties: false
      required: [organizations]
      properties:
        organizations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [organization, tenantId, packs, contexts, defaultPath]
            properties:
              organization: { type: string }
              tenantId: { type: string }
              packs:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [packId, version, name, contexts]
                  properties:
                    packId: { type: string }
                    version: { type: string }
                    name: { type: string }
                    contexts: { type: array, items: { $ref: '#/components/schemas/PackBoundContext' } }
              contexts: { type: array, items: { $ref: '#/components/schemas/PackBoundContext' } }
              defaultPath: { type: string }
    CapabilityDecision:
      type: object
      additionalProperties: false
      required: [applicable, allowed, reasonCode, reason]
      properties:
        applicable: { type: boolean }
        allowed: { type: boolean }
        reasonCode: { type: string }
        reason: { type: string }
    ResolutionCapabilities:
      type: object
      additionalProperties: false
      required: [canAccept, canReview, canPropose, canSubmit, canApprove, canExecute, canClose]
      properties:
        canAccept: { $ref: '#/components/schemas/CapabilityDecision' }
        canReview: { $ref: '#/components/schemas/CapabilityDecision' }
        canPropose: { $ref: '#/components/schemas/CapabilityDecision' }
        canSubmit: { $ref: '#/components/schemas/CapabilityDecision' }
        canApprove: { $ref: '#/components/schemas/CapabilityDecision' }
        canExecute: { $ref: '#/components/schemas/CapabilityDecision' }
        canClose: { $ref: '#/components/schemas/CapabilityDecision' }
    ResolutionCapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [currentActor, resolutionCapabilities, assignableOwnerRoles]
      properties:
        currentActor: { $ref: '#/components/schemas/CurrentActorContext' }
        resolutionCapabilities: { $ref: '#/components/schemas/ResolutionCapabilities' }
        assignableOwnerRoles: { type: array, items: { type: string } }
    ResolutionCase:
      type: object
      additionalProperties: true
      required: [id, tenantId, contextId, exceptionId, status, ownerRole, origin, runtime]
    ResolutionCaseQuery:
      type: object
      additionalProperties: true
      required: [resolutionCase, sourceException, sourceChanged, intakeEvaluationId, currentEvaluationId, evidenceBundle, receipts]
    ResolutionCaseListResponse:
      type: object
      required: [contextId, resolutionCases]
      properties:
        contextId: { type: string }
        resolutionCases:
          type: array
          items:
            type: object
            required: [id, exceptionId, status, ownerRole, title, createdAt, updatedAt]
    RefreshRequest:
      type: object
      required: [endpoints]
      properties:
        endpoints: { type: array, minItems: 1, items: { type: object, required: [id, url], properties: { id: { type: string }, url: { type: string, format: uri } } } }
        kind: { type: string, enum: [quote, order, payment, complaint, email, alert] }
        format: { type: string, enum: [csv, markdown], default: csv }
        sourceId: { type: string }
        version: { type: string }
    ConflictReviewInput:
      type: object
      required: [conflictId, decision, rationale]
      properties:
        conflictId: { type: string }
        decision: { type: string, enum: [acknowledge, accept_left, accept_right, needs_evidence] }
        selectedEvidenceId: { type: string }
        rationale: { type: string, minLength: 1 }
    AdjudicationRequest:
      type: object
      required: [decision, rationale]
      properties: { decision: { type: string, enum: [accept, supplement, reject] }, rationale: { type: string, minLength: 1 } }
    SandboxRequest:
      type: object
      required: [scenario]
      properties: { scenario: { type: string, enum: [evidence, claim, hold] } }
    MoreCapabilityRequest:
      type: object
      required: [action]
      properties: { action: { type: string, enum: [versions, review, outcome, audit] }, result: { type: string }, rationale: { type: string } }
